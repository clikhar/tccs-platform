; TCCS ConfBridge profiles. Deploy this file as /etc/asterisk/confbridge.conf.
[general]

[tccs_bridge]
type=bridge
max_members=50
record_conference=no
record_file_append=no
record_file_timestamp=yes

[tccs_controller]
type=user
admin=yes
marked=yes
announce_only_user=no
announce_user_count=no
announce_user_count_all=no
wait_marked=no
end_marked=no
quiet=no
music_on_hold_when_empty=no

[tccs_station]
type=user
admin=no
marked=no
announce_only_user=no
announce_user_count=no
announce_user_count_all=no
wait_marked=no
end_marked=no
quiet=no
music_on_hold_when_empty=no
