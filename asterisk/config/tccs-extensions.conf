[tccs-stations]

; Backend-originated controller -> station calls arrive here with
; TCCS_CONFERENCE set by AMI Originate.
exten => 900,1,NoOp(TCCS station joining ${TCCS_CONFERENCE})
 same => n,Answer()
 same => n,ExecIf($["${TCCS_CONFERENCE}"=""]?Hangup())
 same => n,ConfBridge(${TCCS_CONFERENCE},tccs_bridge,tccs_station)
 same => n,Hangup()

; Direct station-to-station test/diagnostic dialing.
exten => _10XX,1,NoOp(TCCS direct station test ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Station-to-controller calls use the controller SIP extension as the
; conference namespace. Controller extensions are restricted to 9xxx.
exten => _9XXX,1,NoOp(TCCS station ${CALLERID(num)} joining controller ${EXTEN})
 same => n,Answer()
 same => n,Set(TCCS_CONFERENCE=TCCS-CTRL-${EXTEN})
 same => n,ConfBridge(${TCCS_CONFERENCE},tccs_bridge,tccs_station)
 same => n,Hangup()
