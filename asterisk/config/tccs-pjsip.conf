; TCCS PJSIP configuration.
; Deploy as an include from /etc/asterisk/pjsip.conf.
;
; Stations remain on the existing TCCS UDP transport at port 5060.
; Browser controllers use the existing WSS transport for WebRTC.
; Replace CHANGE-ME passwords with the existing production station/controller
; credentials when deploying this template. Do not commit production secrets.

[transport-tccs]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1001]
type=endpoint
transport=transport-tccs
context=tccs-stations
disallow=all
allow=alaw,ulaw
auth=1001-auth
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid="101 AJNI CABIN" <1001>

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=CHANGE-ME-1001

[1001]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[1002]
type=endpoint
transport=transport-tccs
context=tccs-stations
disallow=all
allow=alaw,ulaw
auth=1002-auth
aors=1002
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid="102 KAMPTEE" <1002>

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=CHANGE-ME-1002

[1002]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[1003]
type=endpoint
transport=transport-tccs
context=tccs-stations
disallow=all
