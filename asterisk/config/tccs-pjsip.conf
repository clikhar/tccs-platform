; Existing static browser controller 9999.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[9999]
type=endpoint
transport=transport-wss
context=tccs-controller
disallow=all
allow=ulaw,alaw
aors=9999
auth=9999-auth
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
direct_media=no
callerid="NGP-WR Controller" <9999>

[9999-auth]
type=auth
auth_type=userpass
username=9999
password=CHANGE-ME-9999

[9999]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

