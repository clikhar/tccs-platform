; Browser controller endpoint for SIP.js/WebRTC
; Production deployment should use TLS/WSS and a trusted certificate.
;
; Keep the controller media on PCMU/PCMA. The installed Asterisk instance does
; not have an Opus transcoding path for ConfBridge announcements, and allowing
; Opus causes ConfBridge to try GSM/SLIN -> Opus translation. That makes the
; single-participant announcement fail and the bridge returns immediately.

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

[9999]
type=endpoint
transport=transport-wss
context=tccs-controller
allow=ulaw,alaw
aors=9999
auth=9999-auth
direct_media=no
webrtc=yes
rtcp_mux=yes
use_avpf=yes
media_encryption=dtls
ice_support=yes
media_use_received_transport=yes
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
callerid="TCCS Controller" <9999>

[9999-auth]
type=auth
auth_type=userpass
username=9999
password=CHANGE-ME-9999

[9999]
type=aor
max_contacts=1
remove_existing=yes
