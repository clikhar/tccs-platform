; TCCS Stage 2 station dialplan
;
; Every controller SIP account has its own conference namespace:
;   TCCS-CTRL-<controller SIP extension>
; Example: controller SIP 9001 -> TCCS-CTRL-9001
;
; Extension 900 is the station-side conference entry point for calls
; originated by the controller backend. The backend passes TCCS_CONFERENCE
; as a channel variable through AMI Originate. There is deliberately no
; shared SECTION01 fallback: a station must always be attached to a
; controller-specific conference.
exten => 900,1,NoOp(TCCS station joining ${TCCS_CONFERENCE})
 same => n,Answer()
 same => n,ExecIf($["${TCCS_CONFERENCE}"=""]?Hangup())
 same => n,ConfBridge(${TCCS_CONFERENCE},tccs_bridge,tccs_station)
 same => n,Hangup()

; Direct station dialing for test/diagnostic use.
exten => _10XX,1,NoOp(TCCS station call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; A station can call a controller SIP account (for example 9001).
; The controller extension itself identifies the isolated conference.
; This keeps station->controller calls inside that controller's bridge.
exten => _9XXX,1,NoOp(TCCS station ${CALLERID(num)} joining controller ${EXTEN} conference)
 same => n,Answer()
 same => n,Set(TCCS_CONFERENCE=TCCS-CTRL-${EXTEN})
 same => n,ConfBridge(${TCCS_CONFERENCE},tccs_bridge,tccs_station)
 same => n,Hangup()
