; TCCS Stage 2 station dialplan

[tccs-stations]
; Extension 900 is the post-answer leg of a controller-originated station call.
exten => 900,1,NoOp(TCCS station answered; joining ${TCCS_CONFERENCE})
 same => n,Answer()
 same => n,ConfBridge(${TCCS_CONFERENCE},tccs_bridge,tccs_station)
 same => n,Hangup()

; Direct station dialing for test/diagnostic use.
exten => _10XX,1,NoOp(TCCS station call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Allow a TCCS station to call the browser controller.
exten => 9999,1,NoOp(TCCS station ${CALLERID(num)} calling controller)
 same => n,Dial(PJSIP/9999,30)
 same => n,Hangup()
