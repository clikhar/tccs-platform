; TCCS Stage 2 station dialplan

[tccs-stations]
; Extension 900 is the station-side conference entry point.
; Use SECTION01 directly so a manually dialed 900 also works; controller-
; originated calls may still provide TCCS_CONFERENCE=SECTION01.
exten => 900,1,NoOp(TCCS station answered; joining SECTION01)
 same => n,Answer()
 same => n,ConfBridge(SECTION01,tccs_bridge,tccs_station)
 same => n,Hangup()

; Direct station dialing for test/diagnostic use.
exten => _10XX,1,NoOp(TCCS station call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; A station dialing 9999 joins the same controller conference instead of
; attempting a second SIP call to the already-connected browser endpoint.
exten => 9999,1,NoOp(TCCS station ${CALLERID(num)} joining controller conference)
 same => n,Answer()
 same => n,ConfBridge(SECTION01,tccs_bridge,tccs_station)
 same => n,Hangup()
