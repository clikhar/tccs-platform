; TCCS conference bridge profiles.
; Keep SECTION01 alive while the controller and stations join/leave.
; Conference recording starts when the first participant enters and stops
; when the last participant leaves. Asterisk stores the WAV in its monitor
; directory (/var/spool/asterisk/monitor by default).

[tccs_bridge]
type=bridge
max_members=0
marked=no
end_marked=no
wait_marked=no
quiet=no
announce_join_leave=no
record_conference=yes
record_file_timestamp=yes

[tccs_controller]
type=user
announce_join_leave=no
announce_user_count=no
quiet=no

[tccs_station]
type=user
announce_join_leave=no
announce_user_count=no
quiet=no
