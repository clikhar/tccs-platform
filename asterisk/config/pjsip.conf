; TCCS Stage 2 - initial PJSIP endpoint configuration
; Test configuration for stations 101-110.
; Credentials are placeholders and must be changed before production use.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[station-template](!)
type=endpoint
transport=transport-udp
context=tccs-stations
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[station-auth-template](!)
type=auth
auth_type=userpass

[station-aor-template](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[1001](station-template)
aors=1001
auth=1001-auth
callerid="101 AJNI CABIN" <1001>

[1001-auth](station-auth-template)
username=1001
password=CHANGE-ME-1001

[1001](station-aor-template)

