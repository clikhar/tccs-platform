; TCCS Stage 2 PJSIP configuration
;
; Stations use the existing TCCS UDP transport on port 5060.
; Browser controllers use the existing WSS transport and WebRTC/DTLS settings.
; Database-managed controller accounts are generated into
; pjsip.d/tccs-controllers.conf by deployment/scripts/sync_controller_sip.py.
;
; IMPORTANT: keep existing station credentials unchanged in production.

[transport-tccs]
type=transport
protocol=udp
bind=0.0.0.0:5060

[station-template](!)
type=endpoint
transport=transport-tccs
context=tccs-stations
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[station-auth-template](!)
type=auth
auth_type=userpass

[station-aor-template](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

