; Browser WebRTC controller dialplan
; Endpoint 9999 calls extension 900 in this context to join SECTION01.
; The explicit bridge/user profiles keep the controller in the bridge until
; the SIP/WebRTC session is disconnected and do not end the bridge because
; the controller is temporarily the only participant.

[tccs-controller]
exten => 900,1,NoOp(TCCS Browser Controller joining SECTION01)
 same => n,Answer()
 same => n,ConfBridge(SECTION01,tccs_bridge,tccs_controller)
 same => n,Hangup()
