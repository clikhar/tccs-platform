; Browser WebRTC controller dialplan
;
; The browser always calls extension 900. Its SIP caller ID is the
; controller's assigned SIP extension, so each controller gets a dedicated
; ConfBridge: TCCS-CTRL-<SIP extension>.
;
[tccs-controller]
exten => 900,1,NoOp(TCCS Browser Controller ${CALLERID(num)} joining dedicated conference)
 same => n,Answer()
 same => n,Set(TCCS_CONFERENCE=TCCS-CTRL-${CALLERID(num)})
 same => n,ConfBridge(${TCCS_CONFERENCE},tccs_bridge,tccs_controller)
 same => n,Hangup()
