; TCCS dialplan boundary.
; Railway business rules remain in TCCS Core; this dialplan only bridges
; SIP calls into the controlled TCCS execution context.

[tccs-endpoints]
exten => _X!,1,NoOp(TCCS endpoint call ${CALLERID(num)} -> ${EXTEN})
 same => n,Answer()
 same => n,ConfBridge(${EXTEN})
 same => n,Hangup()
