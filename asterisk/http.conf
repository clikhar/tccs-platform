; TCCS Asterisk HTTP/WebSocket listener baseline.
; Enable TLS in the actual deployment using site-approved certificates.
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlsbindport=8089
tls_cert=/etc/asterisk/keys/tccs-server.crt
tls_privatekey=/etc/asterisk/keys/tccs-server.key
