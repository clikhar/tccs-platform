; TCCS PJSIP transport policy
; Stage 1 S1.2 baseline. Replace certificate paths and bind addresses per site deployment.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/tccs-server.crt
priv_key_file=/etc/asterisk/keys/tccs-server.key
method=tlsv1_2
verify_client=no
verify_server=no

; Secure WebSocket transport for browser/controller-console SIP clients.
; The HTTP/TLS listener must also be enabled in http.conf.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; Common endpoint template. Device-specific endpoint/auth/aor sections
; should be generated from the centralized TCCS subscriber configuration.
[tccs-endpoint-template](!)
type=endpoint
direct_media=no
context=tccs-endpoints
disallow=all
allow=opus,alaw,ulaw
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[tccs-auth-template](!)
type=auth
auth_type=userpass

[tccs-aor-template](!)
type=aor
max_contacts=1
remove_existing=yes

; Example secure controller endpoint. Do not copy production passwords here.
