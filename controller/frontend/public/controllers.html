<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Controller Management</title><script src="/auth-guard.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#18313d;font-family:Arial}.top{background:#102e42;color:#fff;padding:16px 22px;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #afc1c9;border-radius:5px;padding:15px;margin-bottom:15px}.form{display:grid;grid-template-columns:1fr 1.5fr 1.3fr 100px auto auto;gap:8px;align-items:end}.field{display:grid;gap:4px;font-size:9px;font-weight:bold}.field input,.field select{padding:9px;border:1px solid #9db1ba;border-radius:3px}.btn{padding:9px 12px;border:1px solid #91a5af;background:#fff;border-radius:3px;font-size:10px;font-weight:bold;cursor:pointer}.primary{background:#168a99;color:#fff}.danger{color:#a3232a}.head,.row{display:grid;grid-template-columns:1fr 1.5fr 1.4fr 90px 170px;gap:8px;min-width:760px;align-items:center}.head{background:#1d5367;color:#fff;padding:8px;font-size:8px}.row{padding:9px 8px;border-bottom:1px solid #d9e4e8;font-size:10px}.actions{display:flex;gap:5px}.msg{font-size:11px;margin-bottom:10px}.err{color:#a3232a}.hint{font-size:10px;color:#60747d;line-height:1.5}@media(max-width:850px){.form{grid-template-columns:1fr 1fr}.wrap{padding:10px}}</style></head><body><header class="top"><div><b>TCCS CONTROLLER MANAGEMENT</b><div style="font-size:10px;opacity:.8">Create controller operating identities and assign sections</div></div><button class="btn" id="back">ADMIN HOME</button></header><main class="wrap"><section class="panel"><div id="msg" class="msg"></div><div class="form"><div class="field"><label>CODE</label><input id="code" placeholder="CTRL-01"></div><div class="field"><label>NAME</label><input id="name" placeholder="Control Office 01"></div><div class="field"><label>SECTION</label><select id="section"><option value="">Not assigned</option></select></div><div class="field"><label>ENABLED</label><select id="enabled"><option value="true">YES</option><option value="false">NO</option></select></div><button class="btn primary" id="save">ADD</button><button class="btn" id="clear">CLEAR</button></div><p class="hint">A controller is associated with one operating section. Controller users assigned to it will see that controller's station set.</p></section><section class="panel"><div style="overflow:auto"><div class="head"><b>CODE</b><b>NAME</b><b>SECTION</b><b>STATUS</b><b>ACTIONS</b></div><div id="rows"></div></div></section></main><script>(async function(){const A=TCCS_AUTH,$=id=>document.getElementById(id);let rows=[],editing=null;function headers(){return{Authorization:'Bearer '+A.token(),'Content-Type':'application/json'}}function msg(t,e){$('msg').textContent=t;$('msg').className='msg'+(e?' err':'')}async function api(p,o){const r=await fetch(A.API+p,Object.assign({headers:headers()},o||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}async function init(){const u=await A.verify();if(!u)return;if(u.role!=='ADMINISTRATOR'){location.replace(A.landing(u));return}$('back').onclick=()=>location.href='/admin.html';const sections=await api('/api/v1/master/sections');$('section').innerHTML='<option value="">Not assigned</option>'+sections.filter(s=>s.enabled).map(s=>'<option value="'+s.id+'">'+s.code+' — '+s.name+'</option>').join('');await load();render()}async function load(){rows=await api('/api/v1/master/controllers')}function render(){if(!rows.length){$('rows').innerHTML='<div class="row">No controllers configured.</div>';return}$('rows').innerHTML=rows.map(c=>'<div class="row"><b>'+c.code+'</b><span>'+c.name+'</span><span>'+(c.section_code?c.section_code+' — '+c.section_name:'—')+'</span><span>'+(c.enabled?'ENABLED':'DISABLED')+'</span><span class="actions"><button class="btn" data-edit="'+c.id+'">EDIT</button><button class="btn danger" data-del="'+c.id+'">DELETE</button></span></div>').join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(+b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(+b.dataset.del))}function edit(id){const c=rows.find(x=>x.id===id);if(!c)return;editing=id;$('code').value=c.code;$('name').value=c.name;$('section').value=c.section_id||'';$('enabled').value=String(c.enabled);$('save').textContent='UPDATE';msg('Editing '+c.code)}$('clear').onclick=()=>{editing=null;$('code').value='';$('name').value='';$('section').value='';$('enabled').value='true';$('save').textContent='ADD';msg('')};$('save').onclick=async()=>{try{const body={code:$('code').value.trim(),name:$('name').value.trim(),section_id:$('section').value||null,enabled:$('enabled').value==='true'};await api(editing?'/api/v1/master/controllers/'+editing:'/api/v1/master/controllers',{method:editing?'PUT':'POST',body:JSON.stringify(body)});await load();render();$('clear').click();msg('Controller saved successfully')}catch(e){msg(e.message,true)}};async function remove(id){const c=rows.find(x=>x.id===id);if(!c||!confirm('Delete controller '+c.code+'? Users assigned to it will lose their controller assignment.'))return;try{await api('/api/v1/master/controllers/'+id,{method:'DELETE'});await load();render();msg('Controller deleted')}catch(e){msg(e.message,true)}}init().catch(e=>msg(e.message,true))})();</script></body></html>
