<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS User Management</title><script src="/auth-guard.js"></script><style>body{margin:0;background:#edf2f5;color:#18313d;font-family:Arial}.top{background:#102e42;color:#fff;padding:16px 22px;display:flex;justify-content:space-between}.wrap{max-width:1250px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #afc1c9;border-radius:5px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:1.2fr 1.2fr 1fr 1fr auto auto;gap:8px;align-items:end}.field{display:grid;gap:4px;font-size:9px;font-weight:bold}.field input,.field select{padding:9px;border:1px solid #9db1ba;border-radius:3px}.btn{padding:9px 12px;border:1px solid #91a5af;background:#fff;border-radius:3px;font-size:10px;font-weight:bold}.primary{background:#168a99;color:#fff}.danger{color:#a3232a}.table{overflow:auto}.head,.row{display:grid;grid-template-columns:1.4fr 1.1fr 1.4fr 90px 150px 170px;gap:8px;min-width:900px;align-items:center}.head{background:#1d5367;color:#fff;padding:8px;font-size:8px}.row{padding:9px 8px;border-bottom:1px solid #d9e4e8;font-size:10px}.actions{display:flex;gap:4px}.msg{font-size:11px;margin-bottom:10px}.err{color:#a3232a}.hidden{display:none}@media(max-width:900px){.form{grid-template-columns:1fr 1fr 1fr}.top{padding:12px}.wrap{padding:10px}}</style></head><body><header class="top"><div><b>TCCS USER MANAGEMENT</b><div style="font-size:10px">Users • Roles • Controller assignments</div></div><button class="btn" id="back">ADMIN HOME</button></header><main class="wrap"><section class="panel"><div id="msg" class="msg"></div><div class="form"><div class="field"><label>USERNAME</label><input id="username"></div><div class="field"><label>PASSWORD</label><input id="password" type="password"></div><div class="field"><label>ROLE</label><select id="role"><option value="CONTROLLER">Controller</option><option value="TESTROOM">Testroom</option><option value="ADMINISTRATOR">Administrator</option></select></div><div class="field"><label>ASSIGNED CONTROLLER</label><select id="controller"><option value="">Not assigned</option></select></div><button class="btn primary" id="save">ADD USER</button><button class="btn" id="clear">CLEAR</button></div></section><section class="panel"><div class="table"><div class="head"><b>USERNAME</b><b>ROLE</b><b>CONTROLLER</b><b>STATUS</b><b>PASSWORD</b><b>ACTIONS</b></div><div id="rows"></div></div></section></main><script>
(async function(){
const A=TCCS_AUTH,API=A.API,$=id=>document.getElementById(id);let users=[],controllers=[],editing=null;
const headers=()=>({Authorization:'Bearer '+A.token(),'Content-Type':'application/json'});
function msg(t,e){$('msg').textContent=t;$('msg').className='msg'+(e?' err':'')}
async function api(path,opt){const r=await fetch(API+path,Object.assign({headers:headers()},opt||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}
async function init(){const u=await A.verify();if(!u)return;if(u.role!=='ADMINISTRATOR'){location.replace(A.landing(u));return}$('back').onclick=()=>location.href='/admin.html';await Promise.all([loadControllers(),loadUsers()]);render()}
async function loadControllers(){controllers=await api('/api/v1/master/controllers');$('controller').innerHTML='<option value="">Not assigned</option>'+controllers.filter(c=>c.enabled).map(c=>'<option value="'+c.id+'">'+c.code+' — '+c.name+'</option>').join('')}
async function loadUsers(){users=await api('/api/v1/master/users')}
function render(){if(!users.length){$('rows').innerHTML='<div class="row">No users found.</div>';return}$('rows').innerHTML=users.map(u=>'<div class="row"><b>'+u.username+'</b><span>'+u.role+'</span><span>'+(u.controller_code?u.controller_code+' — '+u.controller_name:'—')+'</span><span>'+ (u.enabled?'ENABLED':'DISABLED')+'</span><span>••••••</span><span class="actions"><button class="btn" data-edit="'+u.id+'">EDIT</button><button class="btn danger" data-del="'+u.id+'">DELETE</button></span></div>').join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeUser(Number(b.dataset.del)))}
function edit(id){const u=users.find(x=>x.id===id);if(!u)return;editing=id;$('username').value=u.username;$('password').value='';$('role').value=u.role;$('controller').value=u.controller_id||'';$('save').textContent='UPDATE USER';msg('Editing '+u.username)}
$('role').onchange=()=>{$('controller').disabled=$('role').value!=='CONTROLLER';if($('role').value!=='CONTROLLER')$('controller').value=''};
$('clear').onclick=()=>{editing=null;$('username').value='';$('password').value='';$('role').value='CONTROLLER';$('controller').value='';$('controller').disabled=false;$('save').textContent='ADD USER';msg('')};
$('save').onclick=async()=>{try{const body={username:$('username').value.trim(),role:$('role').value,enabled:true,controller_id:$('controller').value||null};if(!editing)body.password=$('password').value;else if($('password').value)body.password=$('password').value;await api(editing?'/api/v1/master/users/'+editing:'/api/v1/master/users',{method:editing?'PUT':'POST',body:JSON.stringify(body)});await loadUsers();render();$('clear').click();msg('User saved successfully')}catch(e){msg(e.message,true)}};
async function removeUser(id){const u=users.find(x=>x.id===id);if(!u||!confirm('Delete user '+u.username+'?'))return;try{await api('/api/v1/master/users/'+id,{method:'DELETE'});await loadUsers();render();msg('User deleted')}catch(e){msg(e.message,true)}}
$('role').dispatchEvent(new Event('change'));init().catch(e=>msg(e.message,true));
})();
</script></body></html>
