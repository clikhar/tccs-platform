<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Station Management</title><script src="/auth-guard.js"></script><style>body{margin:0;background:#edf2f5;color:#18313d;font-family:Arial}.top{background:#102e42;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1500px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #afc1c9;border-radius:5px;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select,.field input,.field select{padding:9px;border:1px solid #9db1ba;border-radius:3px}.search{min-width:250px;flex:1}button{padding:8px 12px;border:1px solid #91a5af;background:#fff;border-radius:3px;font-size:10px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#168a99;color:#fff}.danger{color:#a3232a}.msg{padding:8px;margin-bottom:10px;background:#d8e8ed;font-size:10px}.err{background:#fff0f1;color:#a3232a}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stat{border:1px solid #c3d0d5;border-radius:4px;padding:8px 12px;font-size:10px;background:#f8fafb}.stat b{font-size:15px;display:block}.table{overflow:auto;border:1px solid #afc5cb}.head,.row{display:grid;gap:8px;align-items:center;min-width:1250px}.head{grid-template-columns:80px 190px 130px 80px 100px 110px 150px 260px;background:#1d5367;color:#fff;padding:8px;font-size:8px}.row{grid-template-columns:80px 190px 130px 80px 100px 110px 150px 260px;padding:9px 8px;border-bottom:1px solid #d9e4e8;font-size:10px}.registered{color:#168a99;font-weight:bold}.unregistered{color:#a3232a;font-weight:bold}.actions{display:flex;gap:5px;flex-wrap:wrap}.editor{margin-top:12px;padding:12px;border:1px solid #c3d0d5;background:#f8fafb}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field{font-size:9px;font-weight:bold;display:flex;flex-direction:column;gap:4px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:15px;z-index:9999}.modal.hidden{display:none!important}.modalbox{background:#fff;width:min(1000px,95vw);max-height:90vh;display:flex;flex-direction:column;border-radius:6px}.modalhead,.modalfoot{padding:12px 16px;border-bottom:1px solid #ccd8dc;display:flex;justify-content:space-between;align-items:center}.modalfoot{border-top:1px solid #ccd8dc;border-bottom:0;justify-content:flex-end;gap:8px}.modalbody{padding:14px;overflow:auto}.preview{border:1px solid #ccd8dc;overflow:auto}.preview table{border-collapse:collapse;width:100%;font-size:9px}.preview th,.preview td{padding:7px;border-bottom:1px solid #d9e4e8;text-align:left}.preview th{background:#eef4f6}.ok{color:#168a5a;font-weight:bold}.bad{color:#a3232a;font-weight:bold}.hidden{display:none!important}@media(max-width:800px){.stats{display:grid;grid-template-columns:repeat(2,1fr)}} </style></head><body><header class="top"><div><b>TCCS STATION / SUBSCRIBER MANAGEMENT</b><div id="who" style="font-size:10px;opacity:.8"></div></div><div><button id="back">← ADMIN</button> <button id="logout">LOGOUT</button></div></header><main class="wrap"><section class="panel"><div id="msg" class="msg hidden"></div><div class="toolbar"><input id="search" class="search" placeholder="Search station, name, location or SIP"><select id="sectionFilter"><option value="ALL">ALL SECTIONS</option></select><select id="healthFilter"><option value="ALL">ALL HEALTH</option><option value="REGISTERED">REGISTERED</option><option value="UNREGISTERED">UNREGISTERED</option><option value="IN USE">IN USE</option><option value="RINGING">RINGING</option></select><button class="primary" id="add">ADD SUBSCRIBER</button><button id="refresh">REFRESH STATUS</button><button id="export">EXPORT CSV</button><button id="importButton">BULK IMPORT</button></div><input id="csvFile" type="file" accept=".csv,text/csv" class="hidden"><div class="stats"><div class="stat"><b id="total">0</b>TOTAL</div><div class="stat"><b id="enabled">0</b>ENABLED</div><div class="stat"><b id="reg">0</b>REGISTERED</div><div class="stat"><b id="unreg">0</b>UNREGISTERED</div><div class="stat"><b id="active">0</b>ACTIVE CALLS</div></div><div class="table"><div class="head"><b>STATION</b><b>NAME / LOCATION</b><b>SECTION</b><b>SIP</b><b>ENABLED</b><b>REGISTRATION</b><b>ASTERISK STATE</b><b>ACTIONS</b></div><div id="rows"></div></div><section id="editor" class="editor hidden"><div class="formgrid"><label class="field">STATION NUMBER<input id="stationNumber"></label><label class="field">STATION NAME<input id="name"></label><label class="field">LOCATION<input id="location"></label><label class="field">SIP EXTENSION<input id="sip" maxlength="4"></label><label class="field">SECTION<select id="sectionEdit"></select></label><label class="field">STATION TYPE<select id="stationType"><option>WAY_STATION</option><option>CABIN</option><option>CONTROL_POINT</option><option>OTHER</option></select></label></div><p style="font-size:9px">Changing SIP extension is blocked while the station has an active call.</p><button class="primary" id="save">SAVE</button> <button id="cancel">CANCEL</button></section></section></main><div id="importModal" class="modal hidden" aria-hidden="true"><div class="modalbox"><div class="modalhead"><b>BULK IMPORT PREVIEW</b><button id="closeImport">CLOSE</button></div><div class="modalbody"><div id="importInfo" style="font-size:10px;margin-bottom:10px"></div><div class="preview"><table><thead><tr><th>ROW</th><th>STATION</th><th>NAME</th><th>LOCATION</th><th>SECTION</th><th>SIP</th><th>RESULT</th></tr></thead><tbody id="importPreview"></tbody></table></div></div><div class="modalfoot"><button id="cancelImport">CANCEL</button><button class="primary" id="applyImport" disabled>IMPORT VALID ROWS</button></div></div></div><script>(async function(){'use strict';const A=window.TCCS_AUTH,u=await A.verify();if(!u)return;if(u.role!=='ADMINISTRATOR'){location.replace(A.landing(u));return}const $=id=>document.getElementById(id);$('who').textContent=u.username+' • ADMINISTRATOR';$('back').onclick=()=>location.replace('/admin.html');$('logout').onclick=()=>A.logout();let stations=[],sections=[],health={},editing=null,importRows=[];const activeRx=/CALL|IN USE|RINGING|BUSY|CONFERENCE/i;function message(t,error){const m=$('msg');m.textContent=t;m.className='msg'+(error?' err':'')+(t?'':' hidden')}async function api(path,opt){const r=await fetch(A.API+path,opt||{}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function st(s){const h=health[s.sip_extension];return h?{reg:h.status,state:h.asterisk_state||'Not in use'}:{reg:'UNKNOWN',state:'NO SIP DATA'}}function validate(r){if(!/^\d{1,32}$/.test(r.station_number||''))return'Station number must contain digits';if(!String(r.name||'').trim())return'Station name is required';if(!/^10\d{2}$/.test(r.sip_extension||''))return'SIP extension must be 10xx';if(!r.section_id)return'Section is required';return''}async function loadSections(){sections=await api('/v1/sections');$('sectionFilter').innerHTML='<option value="ALL">ALL SECTIONS</option>'+sections.map(s=>'<option value="'+s.id+'">'+esc(s.code)+' — '+esc(s.name)+'</option>').join('');$('sectionEdit').innerHTML=sections.filter(s=>s.enabled).map(s=>'<option value="'+s.id+'">'+esc(s.code)+' — '+esc(s.name)+'</option>').join('')}async function load(){try{stations=await api('/v1/station-management?_='+Date.now());try{const list=await api('/v1/asterisk/endpoints?_='+Date.now());health={};list.forEach(x=>health[x.sip_extension]=x)}catch(e){health={}}render()}catch(e){message('Unable to load station management: '+e.message,true)}}function render(){const q=$('search').value.trim().toLowerCase(),sf=$('sectionFilter').value,hf=$('healthFilter').value;const list=stations.filter(s=>{const h=st(s);return(!q||[s.station_number,s.name,s.location||'',s.sip_extension].join(' ').toLowerCase().includes(q))&&(sf==='ALL'||String(s.section_id)===sf)&&(hf==='ALL'||h.reg===hf||h.state===hf)});$('total').textContent=stations.length;$('enabled').textContent=stations.filter(s=>s.enabled).length;$('reg').textContent=stations.filter(s=>st(s).reg==='REGISTERED').length;$('unreg').textContent=stations.filter(s=>st(s).reg==='UNREGISTERED').length;$('active').textContent=stations.filter(s=>activeRx.test(st(s).state)).length;$('rows').innerHTML=list.map(s=>{const h=st(s),sec=sections.find(x=>x.id===s.section_id);return'<div class="row"><b>'+esc(s.station_number)+'</b><span><b>'+esc(s.name)+'</b><br><small>'+esc(s.location||'')+'</small></span><span>'+esc(sec?sec.code:s.section_id)+'</span><span>'+esc(s.sip_extension)+'</span><span>'+(s.enabled?'ENABLED':'DISABLED')+'</span><span class="'+(h.reg==='REGISTERED'?'registered':'unregistered')+'">'+esc(h.reg)+'</span><span>'+esc(h.state)+'</span><span class="actions"><button data-edit="'+s.id+'">EDIT</button><button data-toggle="'+s.id+'">'+(s.enabled?'DISABLE':'ENABLE')+'</button><button class="danger" data-remove="'+s.id+'">REMOVE</button></span></div>'}).join('')||'<div class="row">No stations match.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(+b.dataset.edit));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(+b.dataset.toggle));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>remove(+b.dataset.remove))}function edit(id){editing=stations.find(s=>s.id===id);if(!editing)return;$('stationNumber').value=editing.station_number;$('name').value=editing.name;$('location').value=editing.location||'';$('sip').value=editing.sip_extension;$('sectionEdit').value=String(editing.section_id);$('stationType').value=editing.station_type||'WAY_STATION';$('editor').classList.remove('hidden')}async function save(){try{const p={station_number:$('stationNumber').value.trim(),name:$('name').value.trim(),location:$('location').value.trim(),sip_extension:$('sip').value.trim(),section_id:Number($('sectionEdit').value),station_type:$('stationType').value,enabled:true};const e=validate(p);if(e)throw Error(e);if(editing&&editing.sip_extension!==p.sip_extension&&activeRx.test(st(editing).state))throw Error('SIP replacement blocked: active call '+st(editing).state);await api(editing?'/v1/station-management/'+editing.id:'/v1/station-management',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});$('editor').classList.add('hidden');editing=null;await load()}catch(e){message(e.message,true)}}async function toggle(id){const s=stations.find(x=>x.id===id);if(!s)return;if(s.enabled&&activeRx.test(st(s).state))return message('Cannot disable '+s.station_number+' during active call',true);try{await api('/v1/station-management/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!s.enabled})});await load()}catch(e){message(e.message,true)}}async function remove(id){const s=stations.find(x=>x.id===id);if(!s||!confirm('Remove subscriber '+s.station_number+'?'))return;try{await api('/v1/station-management/'+id,{method:'DELETE'});await load()}catch(e){message(e.message,true)}}function parseCsv(text){const lines=text.split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const header=lines.shift().split(',').map(x=>x.trim().toLowerCase());return lines.map((line,i)=>{const vals=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));const o={row:i+2};header.forEach((h,j)=>o[h]=vals[j]||'');return o})}function closeImport(){const m=$('importModal');m.classList.add('hidden');m.setAttribute('aria-hidden','true');$('csvFile').value='';$('importPreview').innerHTML='';$('importInfo').textContent='';$('applyImport').disabled=true;importRows=[]}async function previewFile(file){try{const text=await file.text();importRows=parseCsv(text);let valid=0;let html='';importRows.forEach(r=>{const p={station_number:r.station_number,name:r.name,location:r.location||'',section_id:Number(r.section_id),sip_extension:r.sip_extension,station_type:r.station_type||'WAY_STATION',enabled:String(r.enabled).toLowerCase()!=='false'};const err=validate(p);if(!err)valid++;html+='<tr><td>'+r.row+'</td><td>'+esc(r.station_number)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.location)+'</td><td>'+esc(r.section_id)+'</td><td>'+esc(r.sip_extension)+'</td><td class="'+(err?'bad':'ok')+'">'+esc(err||'VALID')+'</td></tr>'});$('importPreview').innerHTML=html||'<tr><td colspan="7">No data rows found.</td></tr>';$('importInfo').textContent=importRows.length+' row(s) found; '+valid+' valid row(s). Invalid rows will be skipped.';$('applyImport').disabled=valid===0;$('importModal').classList.remove('hidden');$('importModal').setAttribute('aria-hidden','false')}catch(e){message('Unable to read CSV: '+e.message,true)}}async function applyImport(){let ok=0,fail=0;for(const r of importRows){const p={station_number:r.station_number,name:r.name,location:r.location||'',section_id:Number(r.section_id),sip_extension:r.sip_extension,station_type:r.station_type||'WAY_STATION',enabled:String(r.enabled).toLowerCase()!=='false'};if(validate(p))continue;try{const existing=stations.find(s=>s.station_number===p.station_number);await api(existing?'/v1/station-management/'+existing.id:'/v1/station-management',{method:existing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});ok++}catch(e){fail++}}closeImport();await load();message('Bulk import completed: '+ok+' successful, '+fail+' failed',fail>0)}$('importButton').onclick=()=>{$('csvFile').value='';$('csvFile').click()};$('csvFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)previewFile(f)};$('closeImport').onclick=closeImport;$('cancelImport').onclick=closeImport;$('applyImport').onclick=applyImport;$('importModal').onclick=e=>{if(e.target===$('importModal'))closeImport()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeImport()});$('add').onclick=()=>{$('editor').classList.remove('hidden');editing=null};$('save').onclick=save;$('cancel').onclick=()=>$('editor').classList.add('hidden');$('refresh').onclick=load;$('search').oninput=render;$('sectionFilter').onchange=render;$('healthFilter').onchange=render;$('export').onclick=()=>{const h=['station_number','name','location','section_id','sip_extension','station_type','enabled'];const data=[h.join(',')].concat(stations.map(s=>h.map(k=>'"'+String(s[k]??'').replace(/"/g,'""')+'"').join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download='tccs-stations.csv';a.click()};await loadSections();await load();setInterval(async()=>{try{const list=await api('/v1/asterisk/endpoints?_='+Date.now());health={};list.forEach(x=>health[x.sip_extension]=x);render()}catch(e){}},5000)})().catch(e=>{const m=document.getElementById('msg');if(m)m.textContent='Station management error: '+e.message})</script></body></html>
