<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Subscriber Management</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#edf2f5;color:#18313d}.top{height:64px;background:#102e42;color:#fff;border-bottom:4px solid #26bfd0;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.title{font-size:22px;font-weight:900;letter-spacing:1px}.sub{font-size:10px;color:#bfe8ed;margin-top:3px}.wrap{max-width:1500px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #afc1c9;border-radius:4px;padding:14px;box-shadow:0 2px 7px #0001}.toolbar{display:flex;gap:7px;margin-bottom:12px}.toolbar input{flex:1}.toolbar input,input,select{border:1px solid #9db1ba;border-radius:3px;padding:9px;font-size:12px}button{border:1px solid #91a5af;background:#fff;border-radius:3px;padding:8px 12px;font-size:10px;font-weight:900;cursor:pointer}button:hover{background:#e7f8fa;border-color:#31a8b7}.primary{background:#168a99;color:#fff;border-color:#0b6270}.danger{color:#ad252c;border-color:#dd8589;background:#fff1f2}.form{background:#f3fafb;border:1px solid #9fc9cf;border-radius:3px;padding:12px;margin-bottom:12px}.form h3{margin:0 0 10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid label{font-size:9px;font-weight:900;text-transform:uppercase;display:grid;gap:4px}.check{display:flex!important;align-items:center;display:flex;gap:6px!important;margin-top:10px}.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}.count{font-size:10px;font-weight:800;color:#637680;margin:8px 0}.table{border:1px solid #afc5cb;border-radius:3px;overflow:auto}.head,.row{display:grid;grid-template-columns:100px minmax(180px,1.5fr) 120px 100px 100px 260px;gap:7px;align-items:center;min-width:880px}.head{background:#1d5367;color:#fff;font-size:8px;padding:8px}.row{padding:8px;border-bottom:1px solid #d9e4e8;font-size:10px}.row:nth-child(even){background:#f5fafb}.row:last-child{border:0}.status{font-weight:900}.on{color:#087c4d}.off{color:#a3232a}.reg{font-weight:900;color:#087c4d}.unreg{font-weight:900;color:#a3232a}.rowactions{display:flex;gap:4px}.msg{margin-bottom:9px;padding:7px 9px;background:#d8e8ed;border-left:4px solid #299cac;font-size:10px;display:none}.err{background:#fff0f1;color:#a3232a;border-left-color:#bd2e35}@media(max-width:800px){.grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}}
</style></head><body><header class="top"><div><div class="title">TCCS SUBSCRIBER MANAGEMENT</div><div class="sub">Station directory • configuration • registration status</div></div><div id="api">API CONNECTING</div></header><main class="wrap"><section class="panel"><div id="msg" class="msg"></div><div class="toolbar"><input id="search" placeholder="Search station / name / location / SIP"><button class="primary" onclick="newStation()">ADD SUBSCRIBER</button><button onclick="load()">REFRESH</button></div><div id="form" class="form" style="display:none"><h3 id="formTitle">ADD SUBSCRIBER</h3><div class="grid"><label>Station Number<input id="number"></label><label>Station Name<input id="name"></label><label>Location<input id="location"></label><label>SIP Extension<input id="sip" placeholder="10xx"></label><label>Section<select id="section"></select></label><label>Station Type<select id="type"><option>WAY_STATION</option><option>CABIN</option><option>CONTROL_POINT</option><option>OTHER</option></select></label></div><label class="check"><input id="enabled" type="checkbox" checked> Enabled</label><div class="actions"><button class="primary" onclick="save()">SAVE</button><button onclick="cancelForm()">CANCEL</button></div></div><div id="count" class="count"></div><div class="table"><div class="head"><b>STATION</b><b>NAME</b><b>SECTION</b><b>SIP</b><b>STATUS</b><b>ACTIONS</b></div><div id="rows"></div></div></section></main><script>
const API=location.origin;let stations=[],sections=[],editing=null,endpoints=[];
const $=id=>document.getElementById(id);function message(t,error=false){const m=$('msg');m.textContent=t;m.style.display=t?'block':'none';m.className='msg'+(error?' err':'')}
async function json(url,opt){const r=await fetch(API+url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||`HTTP ${r.status}`);return d}
async function load(){try{$('api').textContent='API CONNECTED';[stations,sections,endpoints]=await Promise.all([json('/api/v1/station-management'),json('/api/v1/sections'),json('/api/v1/asterisk/endpoints')]);render();message('Directory refreshed')}catch(e){$('api').textContent='API ERROR';message(e.message,true)}}
function render(){const q=$('search').value.trim().toLowerCase();const filtered=stations.filter(s=>!q||[s.station_number,s.name,s.location||'',s.sip_extension].join(' ').toLowerCase().includes(q));$('count').textContent=`${filtered.length} subscriber(s)`;const reg=new Map(endpoints.map(e=>[e.sip_extension,e]));$('rows').innerHTML=filtered.map(s=>{const ep=reg.get(s.sip_extension);return `<div class="row"><strong>${esc(s.station_number)}</strong><span>${esc(s.name)}</span><span>${esc((sections.find(x=>x.id===s.section_id)||{}).code||s.section_id)}</span><span>${esc(s.sip_extension)}</span><span class="status ${s.enabled?'on':'off'}">${s.enabled?'ENABLED':'DISABLED'}<br><small class="${ep?.status==='REGISTERED'?'reg':'unreg'}">${ep?.status==='REGISTERED'?'REGISTERED':'UNREGISTERED'}</small></span><span class="rowactions"><button onclick="edit(${s.id})">EDIT</button><button onclick="toggle(${s.id})">${s.enabled?'DISABLE':'ENABLE'}</button><button class="danger" onclick="removeStation(${s.id})">REMOVE</button></span></div>`}).join('')||'<div class="row"><span>No subscribers found.</span></div>'}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newStation(){editing=null;$('formTitle').textContent='ADD SUBSCRIBER';$('number').value='';$('name').value='';$('location').value='';$('sip').value='';$('type').value='WAY_STATION';$('enabled').checked=true;$('form').style.display='block'}
function edit(id){const s=stations.find(x=>x.id===id);if(!s)return;editing=id;$('formTitle').textContent='EDIT SUBSCRIBER';$('number').value=s.station_number;$('name').value=s.name;$('location').value=s.location||'';$('sip').value=s.sip_extension;$('section').value=s.section_id;$('type').value=s.station_type;$('enabled').checked=s.enabled;$('form').style.display='block'}
function cancelForm(){$('form').style.display='none';editing=null}
async function save(){try{const payload={station_number:$('number').value.trim(),name:$('name').value.trim(),location:$('location').value.trim(),sip_extension:$('sip').value.trim(),section_id:Number($('section').value),station_type:$('type').value,enabled:$('enabled').checked};await json(editing?`/api/v1/station-management/${editing}`:'/api/v1/station-management',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});cancelForm();await load();message(editing?'Subscriber updated':'Subscriber created')}catch(e){message(e.message,true)}}
async function toggle(id){const s=stations.find(x=>x.id===id);if(!s)return;try{await json(`/api/v1/station-management/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!s.enabled})});await load();message(`${s.station_number} ${s.enabled?'disabled':'enabled'}`)}catch(e){message(e.message,true)}}
async function removeStation(id){const s=stations.find(x=>x.id===id);if(!s||!confirm(`Remove subscriber ${s.station_number} — ${s.name}?`))return;try{await json(`/api/v1/station-management/${id}`,{method:'DELETE'});await load();message(`${s.station_number} removed from active subscribers`)}catch(e){message(e.message,true)}}
$('search').addEventListener('input',render);async function initSections(){try{sections=await json('/api/v1/sections');$('section').innerHTML=sections.map(s=>`<option value="${s.id}">${esc(s.code)} — ${esc(s.name)}</option>`).join('')}catch(e){message(e.message,true)}}
(async()=>{await initSections();await load()})();
</script></body></html>
