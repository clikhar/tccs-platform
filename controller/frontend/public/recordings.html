<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCCS Recording Management</title>
<style>
body{margin:0;font-family:Arial;background:#edf2f5;color:#18313d}.top{background:#102e42;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1400px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #afc1c9;border-radius:4px;padding:14px}.login{max-width:420px;margin:70px auto}.field{display:grid;gap:4px;margin-bottom:10px;font-size:10px;font-weight:bold}.field input,.search{padding:9px;border:1px solid #9db1ba;border-radius:3px;width:100%;box-sizing:border-box}button{padding:8px 12px;border:1px solid #91a5af;background:#fff;border-radius:3px;font-size:10px;font-weight:bold;cursor:pointer}.primary{background:#168a99;color:#fff}.danger{background:#fff0f1;color:#a3232a;border-color:#d58a8f}.hidden{display:none}.msg{padding:8px;margin-bottom:10px;background:#d8e8ed;border-left:4px solid #299cac;font-size:10px}.err{background:#fff0f1;color:#a3232a;border-left-color:#bd2e35}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar .search{flex:1}.table{overflow:auto;border:1px solid #afc5cb}.head,.row{display:grid;grid-template-columns:2fr 130px 190px 300px;gap:8px;align-items:center;min-width:850px}.head{background:#1d5367;color:#fff;padding:8px;font-size:8px}.row{padding:9px 8px;border-bottom:1px solid #d9e4e8;font-size:10px}.actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.audio{height:30px;width:250px}.filename{overflow-wrap:anywhere}@media(max-width:700px){.top{padding:14px}.wrap{padding:8px}.audio{width:220px}}
</style>
</head>
<body>
<div id="loginView" class="wrap"><section class="panel login"><h2>TCCS RECORDING MANAGEMENT</h2><div id="loginMsg" class="msg hidden"></div><div class="field"><label>USERNAME</label><input id="user" value="admin"></div><div class="field"><label>PASSWORD</label><input id="pass" type="password"></div><button id="loginBtn" class="primary" style="width:100%">LOGIN</button></section></div>
<div id="app" class="hidden"><header class="top"><div><b>TCCS RECORDING MANAGEMENT</b><div style="font-size:10px">Conference recordings • Playback • Download • Delete</div></div><div><span id="who"></span> <button id="logoutBtn">LOGOUT</button></div></header><main class="wrap"><section class="panel"><div id="msg" class="msg hidden"></div><div class="toolbar"><input id="search" class="search" placeholder="Search recording filename"><button id="refreshBtn" class="primary">REFRESH</button></div><div class="table"><div class="head"><b>RECORDING</b><b>SIZE</b><b>MODIFIED</b><b>ACTIONS</b></div><div id="rows"></div></div></section></main></div>
<script>
(function(){
'use strict';
const API=location.protocol+'//'+location.hostname+':8000';
let token=localStorage.getItem('tccs_admin_token')||'',records=[];
const $=id=>document.getElementById(id);
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
function msg(t,e,target){const m=$(target||'msg');m.textContent=t;m.className='msg'+(e?' err':'');if(!t)m.classList.add('hidden');else m.classList.remove('hidden')}
function authHeaders(extra){return Object.assign({'Authorization':'Bearer '+token},extra||{})}
async function api(path,opt){opt=opt||{};opt.headers=authHeaders(Object.assign({'Content-Type':'application/json'},opt.headers||{}));const r=await fetch(API+path,opt);const d=await r.json().catch(function(){return {}});if(!r.ok){if(r.status===401)logout();throw Error(d.detail||('HTTP '+r.status))}return d}
async function login(){try{const d=await api('/api/v1/master/login',{method:'POST',body:JSON.stringify({username:$('user').value.trim(),password:$('pass').value})});token=d.access_token;localStorage.setItem('tccs_admin_token',token);$('who').textContent=d.username+' • ADMIN';$('loginView').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){msg(e.message,true,'loginMsg')}}
function logout(){$('app').classList.add('hidden');$('loginView').classList.remove('hidden');token='';localStorage.removeItem('tccs_admin_token')}
function size(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB'}
async function playRec(filename,button){const original=button.textContent;button.disabled=true;button.textContent='LOADING...';try{const r=await fetch(API+'/api/v1/master/recordings/'+encodeURIComponent(filename)+'/play',{headers:authHeaders({'Accept':'audio/wav, audio/*'})});if(!r.ok){if(r.status===401)logout();const d=await r.json().catch(function(){return {}});throw Error(d.detail||('HTTP '+r.status))}const blob=await r.blob();if(!blob.size)throw Error('Recording file is empty');const url=URL.createObjectURL(blob);const audio=$('audio-'+encodeURIComponent(filename));if(!audio)throw Error('Audio player not found');audio.pause();audio.src=url;audio.load();audio.onended=function(){URL.revokeObjectURL(url)};await audio.play();msg('Playing '+filename)}catch(e){msg('Unable to play recording: '+e.message,true)}finally{button.disabled=false;button.textContent=original}}
async function downloadRec(filename,button){const original=button.textContent;button.disabled=true;button.textContent='DOWNLOADING...';try{const r=await fetch(API+'/api/v1/master/recordings/'+encodeURIComponent(filename)+'/download',{headers:authHeaders()});if(!r.ok){if(r.status===401)logout();throw Error('HTTP '+r.status)}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}catch(e){msg('Unable to download recording: '+e.message,true)}finally{button.disabled=false;button.textContent=original}}
async function removeRec(filename){if(!confirm('Delete recording '+filename+'? This cannot be undone.'))return;try{await api('/api/v1/master/recordings/'+encodeURIComponent(filename),{method:'DELETE'});await load()}catch(e){msg(e.message,true)}}
function render(){const q=$('search').value.trim().toLowerCase();const list=records.filter(function(r){return !q||r.filename.toLowerCase().includes(q)});$('rows').innerHTML=list.map(function(r){const aid='audio-'+encodeURIComponent(r.filename);return '<div class="row"><div class="filename"><b>'+esc(r.filename)+'</b><div><audio id="'+aid+'" class="audio" controls preload="metadata"></audio></div></div><span>'+size(r.size_bytes)+'</span><span>'+new Date(r.modified_at*1000).toLocaleString()+'</span><span class="actions"><button class="primary playBtn" data-file="'+esc(r.filename)+'">PLAY</button><button class="downloadBtn" data-file="'+esc(r.filename)+'">DOWNLOAD</button><button class="danger deleteBtn" data-file="'+esc(r.filename)+'">DELETE</button></span></div>'}).join('')||'<div class="row">No recordings found.</div>';document.querySelectorAll('.playBtn').forEach(function(b){b.addEventListener('click',function(){playRec(b.dataset.file,b)})});document.querySelectorAll('.downloadBtn').forEach(function(b){b.addEventListener('click',function(){downloadRec(b.dataset.file,b)})});document.querySelectorAll('.deleteBtn').forEach(function(b){b.addEventListener('click',function(){removeRec(b.dataset.file)})})}
async function load(){try{records=await api('/api/v1/master/recordings?_='+Date.now());render();msg(records.length+' recording(s) found')}catch(e){msg(e.message,true)}}
$('loginBtn').addEventListener('click',login);$('logoutBtn').addEventListener('click',logout);$('refreshBtn').addEventListener('click',load);$('search').addEventListener('input',render);$('pass').addEventListener('keydown',function(e){if(e.key==='Enter')login()});
if(token){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');load()}else{$('loginView').classList.remove('hidden')}
})();
</script>
</body>
</html>
