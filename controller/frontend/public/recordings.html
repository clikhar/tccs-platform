<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Recording Management</title><script src="/auth-guard.js"></script><style>body{margin:0;font-family:Arial;background:#edf2f5;color:#18313d}.top{background:#102e42;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1400px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #afc1c9;border-radius:4px;padding:14px}button{padding:8px 12px;border:1px solid #91a5af;background:#fff;border-radius:3px;font-size:10px;font-weight:bold;cursor:pointer}.primary{background:#168a99;color:#fff}.danger{background:#fff0f1;color:#a3232a;border-color:#d58a8f}.msg{padding:8px;margin-bottom:10px;background:#d8e8ed;border-left:4px solid #299cac;font-size:10px}.err{background:#fff0f1;color:#a3232a;border-left-color:#bd2e35}.toolbar{display:flex;gap:8px;margin-bottom:10px}.search{padding:9px;border:1px solid #9db1ba;border-radius:3px;width:100%;box-sizing:border-box;flex:1}.table{overflow:auto;border:1px solid #afc5cb}.head,.row{display:grid;grid-template-columns:2fr 130px 190px 300px;gap:8px;align-items:center;min-width:850px}.head{background:#1d5367;color:#fff;padding:8px;font-size:8px}.row{padding:9px 8px;border-bottom:1px solid #d9e4e8;font-size:10px}.actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.audio{height:30px;width:250px}.filename{overflow-wrap:anywhere}</style></head><body><header class="top"><div><b>TCCS RECORDING MANAGEMENT</b><div style="font-size:10px">Conference recordings • Playback • Download • Delete</div></div><div><span id="who"></span> <button id="backBtn">← BACK</button><button id="logoutBtn" type="button">LOGOUT</button></div></header><main class="wrap"><section class="panel"><div id="msg" class="msg" style="display:none"></div><div class="toolbar"><input id="search" class="search" placeholder="Search recording filename"><button id="refreshBtn" class="primary" type="button">REFRESH</button></div><div class="table"><div class="head"><b>RECORDING</b><b>SIZE</b><b>MODIFIED</b><b>ACTIONS</b></div><div id="rows"></div></div></section></main><script>(async function(){'use strict';const $=id=>document.getElementById(id),A=window.TCCS_AUTH,u=await A.verify();if(!u)return;if(!['TESTROOM','ADMINISTRATOR'].includes(u.role)){location.replace(A.landing(u));return}$('who').textContent=u.username+' • '+u.role;$('backBtn').textContent=u.role==='TESTROOM'?'← BACK TO TESTROOM':'← BACK TO ADMIN';$('backBtn').onclick=function(){location.replace(u.role==='TESTROOM'?'/testroom.html':'/admin.html')};$('logoutBtn').addEventListener('click',function(){try{document.querySelectorAll('audio').forEach(a=>{a.pause();a.removeAttribute('src');a.load()})}catch(e){}localStorage.removeItem('tccs_user_token');localStorage.removeItem('tccs_user');location.replace('/')});const API=A.API;let records=[];function msg(t,e){const m=$('msg');m.textContent=t;m.className='msg'+(e?' err':'');m.style.display=t?'block':'none'}async function api(path,opt){const r=await fetch(API+path,opt||{}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function size(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(2)+' MB'}async function playRec(filename,b){const old=b.textContent;b.disabled=true;b.textContent='LOADING...';try{const r=await fetch(API+'/v1/master/recordings/'+encodeURIComponent(filename)+'/play',{headers:{Accept:'audio/wav, audio/*'}});if(!r.ok)throw Error('HTTP '+r.status);const blob=await r.blob(),url=URL.createObjectURL(blob),audio=$('audio-'+encodeURIComponent(filename));audio.pause();audio.src=url;audio.load();await audio.play();msg('Playing '+filename)}catch(e){msg('Unable to play recording: '+e.message,true)}finally{b.disabled=false;b.textContent=old}}async function downloadRec(filename,b){const old=b.textContent;b.disabled=true;b.textContent='DOWNLOADING...';try{const r=await fetch(API+'/v1/master/recordings/'+encodeURIComponent(filename)+'/download');if(!r.ok)throw Error('HTTP '+r.status);const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){msg('Unable to download recording: '+e.message,true)}finally{b.disabled=false;b.textContent=old}}async function removeRec(filename){if(u.role!=='ADMINISTRATOR')return;if(!confirm('Delete recording '+filename+'? This cannot be undone.'))return;try{await api('/v1/master/recordings/'+encodeURIComponent(filename),{method:'DELETE'});await load()}catch(e){msg(e.message,true)}}function render(){const q=$('search').value.trim().toLowerCase(),list=records.filter(r=>!q||r.filename.toLowerCase().includes(q));$('rows').innerHTML=list.map(r=>{const aid='audio-'+encodeURIComponent(r.filename);return'<div class="row"><div class="filename"><b>'+esc(r.filename)+'</b><div><audio id="'+aid+'" class="audio" controls preload="metadata"></audio></div></div><span>'+size(r.size_bytes)+'</span><span>'+new Date(r.modified_at*1000).toLocaleString()+'</span><span class="actions"><button class="primary playBtn" data-file="'+esc(r.filename)+'">PLAY</button><button class="downloadBtn" data-file="'+esc(r.filename)+'">DOWNLOAD</button>'+(u.role==='ADMINISTRATOR'?'<button class="danger deleteBtn" data-file="'+esc(r.filename)+'">DELETE</button>':'')+'</span></div>'}).join('')||'<div class="row">No recordings found.</div>';document.querySelectorAll('.playBtn').forEach(b=>b.onclick=()=>playRec(b.dataset.file,b));document.querySelectorAll('.downloadBtn').forEach(b=>b.onclick=()=>downloadRec(b.dataset.file,b));document.querySelectorAll('.deleteBtn').forEach(b=>b.onclick=()=>removeRec(b.dataset.file))}async function load(){try{records=await api('/v1/master/recordings?_='+Date.now());render();msg(records.length+' recording(s) found')}catch(e){msg(e.message,true)}}$('refreshBtn').onclick=load;$('search').oninput=render;load()})();</script></body></html>
