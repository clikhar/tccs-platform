<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Recording & Call History</title><script src="/auth-guard.js"></script><style>body{margin:0;font-family:Arial;background:#edf2f5;color:#18313d}.top{background:#102e42;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1500px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #afc1c9;border-radius:4px;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.toolbar>*{box-sizing:border-box}.search{padding:9px;border:1px solid #9db1ba;border-radius:3px;min-width:220px;flex:1}select,input[type=date],input[type=datetime-local]{padding:9px;border:1px solid #9db1ba;border-radius:3px;background:#fff}button{padding:8px 12px;border:1px solid #91a5af;background:#fff;border-radius:3px;font-size:10px;font-weight:bold;cursor:pointer}.primary{background:#168a99;color:#fff}.danger{background:#fff0f1;color:#a3232a;border-color:#d58a8f}.msg{padding:8px;margin-bottom:10px;background:#d8e8ed;border-left:4px solid #299cac;font-size:10px}.err{background:#fff0f1;color:#a3232a;border-left-color:#bd2e35}.table{overflow:auto;border:1px solid #afc5cb}.head,.row{display:grid;gap:8px;align-items:center;min-width:1050px}.history .head,.history .row{grid-template-columns:65px 90px 85px 125px 150px 145px 145px 75px}.recordings .head,.recordings .row{grid-template-columns:2fr 110px 190px 330px;min-width:900px}.head{background:#1d5367;color:#fff;padding:8px;font-size:8px}.row{padding:9px 8px;border-bottom:1px solid #d9e4e8;font-size:10px}.section-title{font-size:15px;font-weight:bold;margin-bottom:10px;color:#164d60}.missed{font-weight:bold}.actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.audio{height:30px;width:250px}.filename{overflow-wrap:anywhere}.badge{display:inline-block;padding:3px 6px;border:1px solid #b5c4c9;border-radius:3px;font-size:8px}.summary{font-size:10px;margin:8px 0;color:#50656d}</style></head><body><header class="top"><div><b>TCCS RECORDING & CALL HISTORY</b><div style="font-size:10px">Call lifecycle • History • Playback • Export</div></div><div><span id="who"></span> <button id="backBtn">← BACK</button><button id="logoutBtn" type="button">LOGOUT</button></div></header><main class="wrap"><div id="msg" class="msg" style="display:none"></div><section class="panel"><div class="section-title">CALL HISTORY</div><div class="toolbar"><select id="type"><option value="ALL">ALL TYPES</option><option value="DIRECT">DIRECT</option><option value="GROUP">GROUP</option><option value="SECTION">SECTION</option><option value="GENERAL">GENERAL</option><option value="INCOMING">INCOMING</option><option value="MISSED">MISSED</option></select><select id="status"><option value="ALL">ALL STATUS</option><option value="RINGING">RINGING</option><option value="ANSWERED">ANSWERED</option><option value="ENDED">ENDED</option><option value="MISSED">MISSED</option><option value="ORIGINATED">ORIGINATED</option></select><input id="from" type="datetime-local" title="From"><input id="to" type="datetime-local" title="To"><input id="historySearch" class="search" placeholder="Search station, name, extension or group"><button id="historyRefresh" class="primary" type="button">REFRESH</button><button id="csvBtn" type="button">EXPORT CSV</button><button id="pdfBtn" type="button">EXPORT PDF</button></div><div id="summary" class="summary"></div><div class="table history"><div class="head"><b>ID</b><b>TYPE</b><b>SOURCE</b><b>TARGET</b><b>ORIGINATED</b><b>ANSWERED</b><b>ENDED</b><b>DURATION</b></div><div id="historyRows"></div></div></section><section class="panel"><div class="section-title">CONFERENCE RECORDINGS</div><div class="toolbar"><input id="recordingSearch" class="search" placeholder="Search recording filename"><button id="refreshBtn" class="primary" type="button">REFRESH</button></div><div class="table recordings"><div class="head"><b>RECORDING</b><b>SIZE</b><b>MODIFIED</b><b>ACTIONS</b></div><div id="rows"></div></div></section></main><script>(async function(){'use strict';const $=id=>document.getElementById(id),A=window.TCCS_AUTH,u=await A.verify();if(!u)return;if(!['TESTROOM','ADMINISTRATOR'].includes(u.role)){location.replace(A.landing(u));return}$('who').textContent=u.username+' • '+u.role;$('backBtn').textContent=u.role==='TESTROOM'?'← BACK TO TESTROOM':'← BACK TO ADMIN';$('backBtn').onclick=()=>location.replace(u.role==='TESTROOM'?'/testroom.html':'/admin.html');$('logoutBtn').onclick=()=>{try{document.querySelectorAll('audio').forEach(a=>{a.pause();a.removeAttribute('src');a.load()})}catch(e){}A.logout()};const API=A.API;let records=[],history=[];function msg(t,e){const m=$('msg');m.textContent=t;m.className='msg'+(e?' err':'');m.style.display=t?'block':'none'}async function api(path,opt){const r=await fetch(API+path,opt||{}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function size(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(2)+' MB'}function dt(v){return v?new Date(v).toLocaleString():'—'}function duration(r){if(r.duration_seconds!=null){const s=Number(r.duration_seconds)||0;return s>=3600?Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m '+s%60+'s':Math.floor(s/60)+'m '+s%60+'s'}return'—'}function filterParams(){const p=new URLSearchParams();const type=$('type').value,status=$('status').value,from=$('from').value,to=$('to').value;if(type!=='ALL')p.set('call_type',type);if(status!=='ALL')p.set('status',status);if(from)p.set('date_from',new Date(from).toISOString());if(to)p.set('date_to',new Date(to).toISOString());return p}function renderHistory(){const q=$('historySearch').value.trim().toLowerCase();const list=history.filter(r=>{if(!q)return true;return[r.id,r.call_type,r.source_extension,r.target_station_number,r.target_name,r.group_code,r.status].some(v=>String(v??'').toLowerCase().includes(q))});$('historyRows').innerHTML=list.map(r=>{const target=((r.target_station_number||'')+' '+(r.target_name||'')).trim()||r.group_code||'—';return'<div class="row '+(r.status==='MISSED'?'missed':'')+'"><span>'+r.id+'</span><span><span class="badge">'+esc(r.call_type)+'</span></span><span>'+esc(r.source_extension)+'</span><span>'+esc(target)+'</span><span>'+esc(dt(r.originated_at))+'</span><span>'+esc(dt(r.answered_at))+'</span><span>'+esc(dt(r.ended_at))+'</span><span>'+esc(duration(r))+'</span></div>'}).join('')||'<div class="row">No call history found.</div>';$('summary').textContent=list.length+' matching call(s) • '+history.filter(r=>r.status==='MISSED').length+' missed in loaded result'}async function loadHistory(){try{const p=filterParams();p.set('limit','5000');history=await api('/v1/master/recordings/history?'+p.toString()+'&_='+Date.now());renderHistory()}catch(e){msg('Unable to load call history: '+e.message,true)}}async function exportHistory(kind,b){const old=b.textContent;b.disabled=true;b.textContent='EXPORTING...';try{const p=filterParams();p.set('_',Date.now());const r=await fetch(API+'/v1/master/recordings/history/export.'+kind+'?'+p.toString(),{headers:{Accept:kind==='pdf'?'application/pdf':'text/csv'}});if(!r.ok)throw Error('HTTP '+r.status);const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tccs-call-history.'+kind;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);msg('Call history exported as '+kind.toUpperCase())}catch(e){msg('Unable to export history: '+e.message,true)}finally{b.disabled=false;b.textContent=old}}async function playRec(filename,b){const old=b.textContent;b.disabled=true;b.textContent='LOADING...';try{const r=await fetch(API+'/v1/master/recordings/'+encodeURIComponent(filename)+'/play',{headers:{Accept:'audio/wav, audio/*'}});if(!r.ok)throw Error('HTTP '+r.status);const blob=await r.blob(),url=URL.createObjectURL(blob),audio=$('audio-'+encodeURIComponent(filename));audio.pause();audio.src=url;audio.load();await audio.play();msg('Playing '+filename)}catch(e){msg('Unable to play recording: '+e.message,true)}finally{b.disabled=false;b.textContent=old}}async function downloadRec(filename,b){const old=b.textContent;b.disabled=true;b.textContent='DOWNLOADING...';try{const r=await fetch(API+'/v1/master/recordings/'+encodeURIComponent(filename)+'/download');if(!r.ok)throw Error('HTTP '+r.status);const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){msg('Unable to download recording: '+e.message,true)}finally{b.disabled=false;b.textContent=old}}async function removeRec(filename){if(u.role!=='ADMINISTRATOR')return;if(!confirm('Delete recording '+filename+'? This cannot be undone.'))return;try{await api('/v1/master/recordings/'+encodeURIComponent(filename),{method:'DELETE'});await loadRecords()}catch(e){msg(e.message,true)}}function renderRecords(){const q=$('recordingSearch').value.trim().toLowerCase(),list=records.filter(r=>!q||r.filename.toLowerCase().includes(q));$('rows').innerHTML=list.map(r=>{const aid='audio-'+encodeURIComponent(r.filename);return'<div class="row"><div class="filename"><b>'+esc(r.filename)+'</b><div><audio id="'+aid+'" class="audio" controls preload="metadata"></audio></div></div><span>'+size(r.size_bytes)+'</span><span>'+new Date(r.modified_at*1000).toLocaleString()+'</span><span class="actions"><button class="primary playBtn" data-file="'+esc(r.filename)+'">PLAY</button><button class="downloadBtn" data-file="'+esc(r.filename)+'">DOWNLOAD</button>'+(u.role==='ADMINISTRATOR'?'<button class="danger deleteBtn" data-file="'+esc(r.filename)+'">DELETE</button>':'')+'</span></div>'}).join('')||'<div class="row">No recordings found.</div>';document.querySelectorAll('.playBtn').forEach(b=>b.onclick=()=>playRec(b.dataset.file,b));document.querySelectorAll('.downloadBtn').forEach(b=>b.onclick=()=>downloadRec(b.dataset.file));document.querySelectorAll('.deleteBtn').forEach(b=>b.onclick=()=>removeRec(b.dataset.file))}async function loadRecords(){try{records=await api('/v1/master/recordings?_='+Date.now());renderRecords()}catch(e){msg('Unable to load recordings: '+e.message,true)}}$('historyRefresh').onclick=loadHistory;$('type').onchange=loadHistory;$('status').onchange=loadHistory;$('from').onchange=loadHistory;$('to').onchange=loadHistory;$('historySearch').oninput=renderHistory;$('csvBtn').onclick=()=>exportHistory('csv',$('csvBtn'));$('pdfBtn').onclick=()=>exportHistory('pdf',$('pdfBtn'));$('refreshBtn').onclick=loadRecords;$('recordingSearch').oninput=renderRecords;await Promise.all([loadHistory(),loadRecords()])})();</script></body></html>
