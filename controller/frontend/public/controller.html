<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Controller</title><style>body{margin:0;background:#edf2f5;color:#18313d;font-family:Arial}.page-nav{position:fixed;top:10px;left:10px;z-index:10000;display:none;padding:9px 14px;border:1px solid #9fb2ba;border-radius:4px;background:#17333f;color:#fff;font:700 11px Arial,sans-serif;cursor:pointer;box-shadow:0 2px 8px #0003}.page-nav:hover{background:#24556a}.selector{min-height:100vh;padding:55px 24px;box-sizing:border-box}.selector-inner{max-width:1100px;margin:auto}.selector h1{margin:0 0 8px;color:#17333f;font-size:22px}.selector p{margin:0 0 22px;color:#60747d;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.section-card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #afc1c9;border-radius:6px;padding:20px;cursor:pointer}.section-card:hover{border-color:#168a99;box-shadow:0 5px 15px #17333f18}.code{font-size:10px;color:#168a99;font-weight:bold}.section-card h2{margin:8px 0;font-size:17px}.section-card div:last-child{font-size:11px;color:#60747d}.empty{background:#fff;border:1px solid #afc1c9;border-radius:6px;padding:20px;font-size:12px;color:#60747d}.error{color:#a33;background:#fff;border-color:#d8aaaa}.loading{font-size:12px;color:#60747d}</style><script src="/auth-guard.js"></script><script>window.__TCCS_PAGE_ROLE='CONTROLLER';</script></head><body><button id="pageBack" class="page-nav" type="button">← BACK</button><div id="sectionSelector" class="selector" style="display:none"><div class="selector-inner"><h1>Select Control Section</h1><p>Choose the control section whose controller console you want to open.</p><div id="sectionGrid" class="grid"><div class="loading">Loading available control sections...</div></div></div></div><div id="root"></div><script>(async function(){const u=await window.TCCS_AUTH.verify();if(!u)return;const params=new URLSearchParams(location.search);const selectedControllerId=params.get('controller_id');if(!['CONTROLLER','TESTROOM','ADMINISTRATOR'].includes(u.role)){location.replace(window.TCCS_AUTH.landing(u));return}const back=document.getElementById('pageBack');if(u.role==='TESTROOM'){back.textContent='← BACK TO TESTROOM';back.style.display='block';back.onclick=function(){location.replace('/testroom.html')}}else if(u.role==='ADMINISTRATOR'){back.textContent='← BACK TO ADMIN';back.style.display='block';back.onclick=function(){location.replace('/admin.html')}}async function loadApplication(){const s=document.createElement('script');s.type='module';s.src='/src/main.tsx';document.body.appendChild(s);syncIdentity();window.setInterval(syncIdentity,1000)}async function syncIdentity(){try{const c=await window.TCCS_AUTH.controllerContext();if(!c)return;window.TCCS_CONTROLLER_CONTEXT=c;window.TCCS_SIP_ACCOUNT=c.sip_account_id?{id:c.sip_account_id,name:c.sip_account_name,extension:c.sip_extension,username:c.sip_username,password:c.sip_password,enabled:c.sip_enabled}:null;const sectionName=c.section_name||c.section_code||'No Section';const controllerName=c.name||c.code||'Controller';document.title='TCCS Controller — '+controllerName+' — '+sectionName;const top=document.querySelector('.top-status');if(top){const spans=top.querySelectorAll('span');if(spans[0])spans[0].textContent='SECTION '+sectionName;if(spans[1])spans[1].textContent='CONTROLLER '+controllerName}const heading=document.querySelector('.heading p');if(heading)heading.textContent=(c.section_code?c.section_code+' — ':'')+sectionName+' • LIVE VOIP CONTROL';const audio=document.querySelector('.controller-audio-subtitle');if(audio)audio.textContent='SIP '+(c.sip_extension||'NOT ASSIGNED')+' • '+sectionName;document.querySelectorAll('.conference-subtitle').forEach(el=>el.textContent=sectionName+' • LIVE CALL CONTROL')}catch{}}async function showSectionSelector(){const selector=document.getElementById('sectionSelector');const grid=document.getElementById('sectionGrid');selector.style.display='block';try{const headers={Authorization:'Bearer '+window.TCCS_AUTH.token()};const [sr,cr]=await Promise.all([fetch(window.TCCS_AUTH.API+'/v1/master/sections',{headers}),fetch(window.TCCS_AUTH.API+'/v1/master/controllers',{headers})]);if(!sr.ok||!cr.ok)throw Error('Unable to load control sections');const sections=await sr.json();const controllers=await cr.json();const bySection=new Map();(Array.isArray(controllers)?controllers:[]).filter(c=>c&&c.enabled!==false&&c.section_id!=null).forEach(c=>{if(!bySection.has(String(c.section_id)))bySection.set(String(c.section_id),c)});const active=(Array.isArray(sections)?sections:[]).filter(s=>s&&s.enabled!==false&&bySection.has(String(s.id)));grid.innerHTML='';if(!active.length){grid.innerHTML='<div class="empty">No enabled control sections with an assigned controller are available.</div>';return}active.forEach(s=>{const c=bySection.get(String(s.id));const a=document.createElement('a');a.className='section-card';a.href='/controller.html?controller_id='+encodeURIComponent(c.id);const code=document.createElement('div');code.className='code';code.textContent=s.code||'CONTROL SECTION';const h=document.createElement('h2');h.textContent=s.name||s.code||'Control Section';const d=document.createElement('div');d.textContent='Controller: '+(c.name||c.code||'Assigned');a.append(code,h,d);grid.appendChild(a)})}catch(e){grid.innerHTML='<div class="empty error">Unable to load available control sections. Please return to Administrator and try again.</div>'}}if(u.role==='ADMINISTRATOR'&&!selectedControllerId){document.getElementById('root').style.display='none';await showSectionSelector();return}if(u.role==='ADMINISTRATOR'&&selectedControllerId){document.getElementById('sectionSelector').style.display='none'}await loadApplication()})();</script></body></html>
