<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Controller</title><style>body{margin:0}.page-nav{position:fixed;top:10px;left:10px;z-index:10000;display:none;padding:9px 14px;border:1px solid #9fb2ba;border-radius:4px;background:#17333f;color:#fff;font:700 11px Arial,sans-serif;cursor:pointer;box-shadow:0 2px 8px #0003}.page-nav:hover{background:#24556a}</style><script src="/auth-guard.js"></script><script>window.__TCCS_PAGE_ROLE='CONTROLLER';</script></head><body><button id="pageBack" class="page-nav" type="button">← BACK</button><div id="root"></div><script type="module" src="/src/main.tsx"></script><script>(async function(){const u=await window.TCCS_AUTH.verify();if(!u)return;if(!['CONTROLLER','TESTROOM','ADMINISTRATOR'].includes(u.role)){location.replace(window.TCCS_AUTH.landing(u));return}const back=document.getElementById('pageBack');if(u.controller){document.title='TCCS Controller — '+u.controller.code+' — '+u.controller.name}if(u.role==='TESTROOM'){back.textContent='← BACK TO TESTROOM';back.style.display='block';back.onclick=function(){location.replace('/testroom.html')}}else if(u.role==='ADMINISTRATOR'){back.textContent='← BACK TO ADMIN';back.style.display='block';back.onclick=function(){location.replace('/admin.html')}}})();</script></body></html>
