<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Emergency Control</title><style>body{margin:0;background:#0b0f14;color:#f4f7fa;font-family:Arial,sans-serif}header{padding:18px 22px;border-bottom:1px solid #26303a;display:flex;justify-content:space-between;align-items:center}.title{font-size:22px;font-weight:800}.badge{font-weight:800;padding:7px 12px;border-radius:6px;background:#401515;color:#ff7777}.wrap{padding:20px;max-width:1100px;margin:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button{border:0;border-radius:6px;padding:12px 18px;font-weight:800;cursor:pointer;background:#263442;color:#fff}button.emergency{background:#b51f2a;font-size:18px;min-width:220px}button.ack{background:#9b6a12}.card{border:1px solid #293541;border-radius:8px;padding:16px;margin-bottom:14px;background:#111820}.row{display:grid;grid-template-columns:1fr 1fr 120px 120px auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #26303a}.row:last-child{border-bottom:0}.muted{color:#9ca8b3}.on{color:#66df91}.off{color:#ff7373}.event{display:grid;grid-template-columns:70px 160px 130px 130px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #26303a}.msg{margin:12px 0;font-weight:700}.err{color:#ff7373}.login{max-width:420px;margin:90px auto}.login input,.form input,.form select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;background:#0c1218;color:#fff;border:1px solid #34414d;border-radius:5px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .full{grid-column:1/-1}@media(max-width:700px){.row,.event,.form{grid-template-columns:1fr}.rowactions{display:flex;gap:8px;flex-wrap:wrap}}.hidden{display:none}</style></head><body><header><div class="title">TCCS — EMERGENCY CONTROL</div><div class="badge">EMERGENCY PRIORITY</div></header><div class="wrap"><section id="login" class="card login"><h2>ADMIN AUTHENTICATION</h2><p class="muted">Use the same TCCS Master Administrator account.</p><input id="user" value="admin" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><div id="loginMsg" class="msg"></div></section><main id="app" class="hidden"><div class="toolbar"><button class="emergency" onclick="confirmEmergency()">🚨 EMERGENCY CALL</button><button onclick="loadAll()">REFRESH</button><button onclick="logout()">LOGOUT</button></div><div id="msg" class="msg"></div><div class="card"><h2>Emergency Groups</h2><div id="groups"></div></div><div class="card"><h2>Emergency Events</h2><div id="events"></div></div><div class="card"><h2>Create Emergency Group</h2><div class="form"><div><label>Code</label><input id="code" placeholder="EMERGENCY-SEC01"></div><div><label>Name</label><input id="name" placeholder="Section 01 Emergency"></div><div><label>Section ID (optional)</label><input id="section" type="number"></div><div><label>Priority</label><input id="priority" type="number" value="1000"></div><div class="full"><button onclick="createGroup()">CREATE GROUP</button></div></div></div></main></div><script>const API=location.protocol+'//'+location.hostname+':8000';let token=localStorage.getItem('tccs_admin_token')||'';const $=id=>document.getElementById(id);async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch(API+path,opt),d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)logout();throw Error(d.detail||('HTTP '+r.status))}return d}async function login(){try{let d=await api('/api/v1/master/login',{method:'POST',body:JSON.stringify({username:$('user').value.trim(),password:$('pass').value})});token=d.access_token;localStorage.setItem('tccs_admin_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadAll()}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').className='msg err'}}function logout(){token='';localStorage.removeItem('tccs_admin_token');$('app').classList.add('hidden');$('login').classList.remove('hidden')}async function loadAll(){try{let[g,e]=await Promise.all([api('/api/v1/emergency/groups'),api('/api/v1/emergency/events?limit=50')]);renderGroups(g);renderEvents(e);$('msg').textContent='Emergency data refreshed';$('msg').className='msg'}catch(e){$('msg').textContent=e.message;$('msg').className='msg err'}}function renderGroups(groups){$('groups').innerHTML=groups.map(g=>`<div class="row"><div><b>${esc(g.code)}</b><br><span class="muted">${esc(g.name)}</span></div><div>${g.members.length} enabled member(s)<br><span class="muted">${g.members.map(x=>esc(x.station_number)).join(', ')}</span></div><div>Priority<br><b>${g.priority}</b></div><div class="${g.enabled?'on':'off'}">${g.enabled?'ENABLED':'DISABLED'}</div><div><button class="emergency" onclick="callEmergency(${g.id},'${esc(g.code)}')">CALL GROUP</button></div></div>`).join('')||'<p class="muted">No emergency groups configured.</p>'}function renderEvents(events){$('events').innerHTML=events.map(e=>`<div class="event"><b>#${e.id}</b><span>${esc(e.group_code||'—')}</span><span>${esc(e.status)}</span><span>${e.target_count} target(s)</span><span>${new Date(e.originated_at).toLocaleString()}</span>${e.status==='ORIGINATED'?`<button class="ack" onclick="ack(${e.id})">ACKNOWLEDGE</button>`:''}</div>`).join('')||'<p class="muted">No emergency events.</p>'}async function createGroup(){try{let s=$('section').value;let g=await api('/api/v1/emergency/groups',{method:'POST',body:JSON.stringify({code:$('code').value,name:$('name').value,section_id:s?Number(s):null,priority:Number($('priority').value)})});await loadAll();alert('Created '+g.code+'. Add members through the emergency API/admin configuration before operational use.')}catch(e){$('msg').textContent=e.message;$('msg').className='msg err'}}async function callEmergency(id,code){if(!confirm('START EMERGENCY CALL to '+code+'? This will originate calls to every enabled member.'))return;try{let r=await api('/api/v1/emergency/calls/groups/'+id,{method:'POST'});$('msg').textContent=`EMERGENCY ${r.status}: ${r.originated_count}/${r.target_count} calls originated`;$('msg').className='msg';await loadAll()}catch(e){$('msg').textContent=e.message;$('msg').className='msg err'}}async function confirmEmergency(){let groups=await api('/api/v1/emergency/groups');let g=groups.find(x=>x.enabled&&x.members.length);if(!g){$('msg').textContent='No enabled emergency group with members configured';$('msg').className='msg err';return}await callEmergency(g.id,g.code)}async function ack(id){try{await api('/api/v1/emergency/events/'+id+'/acknowledge',{method:'POST'});await loadAll()}catch(e){$('msg').textContent=e.message;$('msg').className='msg err'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(token){api('/api/v1/master/me').then(()=>{$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll()}).catch(()=>logout())}</script></body></html>
