<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Station Management</title><script src="/auth-guard.js"></script><style>body{margin:0;background:#edf2f5;color:#18313d;font-family:Arial}.top{background:#102e42;color:#fff;padding:16px 22px;display:flex;justify-content:space-between}.wrap{max-width:1300px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #afc1c9;border-radius:5px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}.field{display:grid;gap:4px;font-size:9px;font-weight:bold}.field input,.field select{padding:9px;border:1px solid #9db1ba;border-radius:3px}.btn{padding:9px 12px;border:1px solid #91a5af;background:#fff;border-radius:3px;font-size:10px;font-weight:bold;cursor:pointer}.primary{background:#168a99;color:#fff}.danger{color:#a3232a}.msg{font-size:11px;margin-bottom:10px}.err{color:#a3232a}.table{overflow:auto}.head,.row{display:grid;grid-template-columns:90px 1.4fr 1.4fr 110px 110px 190px;gap:8px;min-width:900px;align-items:center}.head{background:#1d5367;color:#fff;padding:8px;font-size:8px}.row{padding:9px 8px;border-bottom:1px solid #d9e4e8;font-size:10px}.actions{display:flex;gap:5px;flex-wrap:wrap}@media(max-width:900px){.form{grid-template-columns:1fr 1fr 1fr}}</style></head><body><header class="top"><b>TCCS STATION MANAGEMENT</b><div><button class="btn" id="back">ADMIN HOME</button> <button class="btn" id="logout">LOGOUT</button></div></header><main class="wrap"><section class="panel"><div id="msg" class="msg"></div><div class="form"><div class="field"><label>STATION NUMBER</label><input id="number" placeholder="101"></div><div class="field"><label>NAME</label><input id="name" placeholder="AJNI CABIN"></div><div class="field"><label>LOCATION</label><input id="location" placeholder="AJNI"></div><div class="field"><label>SIP EXTENSION</label><input id="sip" placeholder="1001"></div><div class="field"><label>SECTION</label><select id="section"></select></div><div class="field"><label>STATION TYPE</label><select id="type"></select></div><button class="btn primary" id="save">ADD STATION</button><button class="btn" id="clear">CLEAR</button></div></section><section class="panel"><div class="table"><div class="head"><b>NO.</b><b>NAME</b><b>LOCATION</b><b>SECTION</b><b>SIP</b><b>ACTIONS</b></div><div id="rows"></div></div></section></main><script>(async function(){const A=TCCS_AUTH,$=id=>document.getElementById(id),API=A.API;let stations=[],sections=[],types=[],editing=null;function msg(t,e){$('msg').textContent=t;$('msg').className='msg'+(e?' err':'')}function headers(){return{Authorization:'Bearer '+A.token(),'Content-Type':'application/json'}}async function api(path,opt){const r=await fetch(API+path,Object.assign({headers:headers()},opt||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}async function init(){const u=await A.verify();if(!u)return;if(u.role!=='ADMINISTRATOR'){location.replace(A.landing(u));return}$('back').onclick=()=>location.href='/admin.html';$('logout').onclick=A.logout;await loadMasters();await load();render()}async function loadMasters(){[sections,types]=await Promise.all([api('/v1/master/sections'),api('/v1/master/station-types')]);$('section').innerHTML='<option value="">Select section</option>'+sections.filter(x=>x.enabled).map(x=>'<option value="'+x.id+'">'+x.code+' — '+x.name+'</option>').join('');$('type').innerHTML='<option value="">Select type</option>'+types.filter(x=>x.enabled).map(x=>'<option value="'+x.code+'">'+x.code+' — '+x.name+'</option>').join('')}async function load(){stations=await api('/v1/master/stations?_='+Date.now())}function render(){if(!stations.length){$('rows').innerHTML='<div class="row">No stations found.</div>';return}$('rows').innerHTML=stations.map(s=>'<div class="row"><b>'+s.station_number+'</b><span>'+s.name+'</span><span>'+ (s.location||'—')+'</span><span>'+ (s.section_code||s.section_id||'—')+'</span><span>'+s.sip_extension+'</span><span class="actions"><button class="btn" onclick="editStation('+s.id+')">EDIT</button><button class="btn" onclick="toggleStation('+s.id+')">'+(s.enabled?'DISABLE':'ENABLE')+'</button><button class="btn danger" onclick="deleteStation('+s.id+')">DELETE</button></span></div>').join('')}window.editStation=id=>{const s=stations.find(x=>x.id===id);if(!s)return;editing=id;$('number').value=s.station_number;$('name').value=s.name;$('location').value=s.location||'';$('sip').value=s.sip_extension;$('section').value=s.section_id||'';$('type').value=s.station_type||s.type_code||'';$('save').textContent='UPDATE STATION';msg('Editing station '+s.station_number)};window.toggleStation=async id=>{const s=stations.find(x=>x.id===id);if(!s)return;try{await api('/v1/master/stations/'+id,{method:'PUT',body:JSON.stringify({station_number:s.station_number,name:s.name,location:s.location||'',sip_extension:s.sip_extension,section_id:s.section_id,station_type:s.station_type||s.type_code,enabled:!s.enabled})});await load();render();msg('Station updated')}catch(e){msg(e.message,true)}};window.deleteStation=async id=>{const s=stations.find(x=>x.id===id);if(!s||!confirm('Delete station '+s.station_number+'?'))return;try{await api('/v1/master/stations/'+id,{method:'DELETE'});await load();render();msg('Station deleted')}catch(e){msg(e.message,true)}};$('clear').onclick=()=>{editing=null;$('number').value='';$('name').value='';$('location').value='';$('sip').value='';$('section').value='';$('type').value='';$('save').textContent='ADD STATION';msg('')};$('save').onclick=async()=>{try{const body={station_number:$('number').value.trim(),name:$('name').value.trim(),location:$('location').value.trim(),sip_extension:$('sip').value.trim(),section_id:$('section').value||null,station_type:$('type').value||null,enabled:true};await api(editing?'/v1/master/stations/'+editing:'/v1/master/stations',{method:editing?'PUT':'POST',body:JSON.stringify(body)});await load();render();$('clear').click();msg('Station saved successfully')}catch(e){msg(e.message,true)}};init().catch(e=>msg(e.message,true))})();</script></body></html>
