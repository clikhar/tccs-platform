<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Station Management</title><script src="/auth-guard.js"></script><style>body{margin:0;background:#edf2f5;color:#18313d;font-family:Arial}.top{background:#102e42;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1400px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #afc1c9;border-radius:5px;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{padding:9px 12px;border:1px solid #91a5af;background:#fff;border-radius:3px;font-size:10px;font-weight:bold;cursor:pointer}.primary{background:#168a99;color:#fff}.danger{color:#a3232a}.msg{font-size:11px;margin-bottom:10px}.err{color:#a3232a}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{border:1px solid #c6d4d9;padding:10px;border-radius:4px}.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:#60747d}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select,.form input,.form select{padding:9px;border:1px solid #9db1ba;border-radius:3px}.form{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}.field{display:grid;gap:4px;font-size:9px;font-weight:bold}.table{overflow:auto}.head,.row{display:grid;grid-template-columns:80px 1.3fr 1.2fr 100px 100px 105px 115px 220px;gap:8px;min-width:1050px;align-items:center}.head{background:#1d5367;color:#fff;padding:8px;font-size:8px}.row{padding:8px;border-bottom:1px solid #d9e4e8;font-size:10px}.actions{display:flex;gap:5px;flex-wrap:wrap}.ok{color:#168a5a;font-weight:bold}.bad{color:#a3232a;font-weight:bold}.warn{color:#a56b00;font-weight:bold}.modal{position:fixed;inset:0;background:rgba(10,25,35,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.dialog{background:#fff;border-radius:6px;width:min(1100px,96vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}.dialog-head{padding:14px 16px;border-bottom:1px solid #ccd8dc;display:flex;justify-content:space-between;align-items:center}.dialog-body{padding:14px;overflow:auto}.dialog-foot{padding:12px 16px;border-top:1px solid #ccd8dc;display:flex;justify-content:flex-end;gap:8px}.preview{border:1px solid #ccd8dc;overflow:auto}.preview table{border-collapse:collapse;width:100%;font-size:9px}.preview th,.preview td{padding:6px;border-bottom:1px solid #d9e4e8;text-align:left}.preview th{background:#eef4f6}.health{font-size:8px}.hidden{display:none!important}@media(max-width:1000px){.form{grid-template-columns:1fr 1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div><b>TCCS STATION MANAGEMENT</b><div style="font-size:10px;opacity:.8">Subscriber directory • SIP health • configuration</div></div><div><button class="btn" id="back">ADMIN HOME</button> <button class="btn" id="logout">LOGOUT</button></div></header><main class="wrap"><section class="panel"><div id="msg" class="msg"></div><div class="stats"><div class="stat"><b id="total">0</b><span>TOTAL STATIONS</span></div><div class="stat"><b id="enabled">0</b><span>ENABLED</span></div><div class="stat"><b id="registered">0</b><span>REGISTERED</span></div><div class="stat"><b id="unregistered">0</b><span>UNREGISTERED</span></div><div class="stat"><b id="active">0</b><span>ACTIVE CALLS</span></div></div></section><section class="panel"><div class="toolbar"><button class="btn primary" id="add">ADD STATION</button><button class="btn" id="import">BULK IMPORT</button><button class="btn" id="export">EXPORT CSV</button><button class="btn" id="refresh">REFRESH HEALTH</button><input id="search" placeholder="Search station / name / SIP / location"><select id="healthFilter"><option value="ALL">ALL HEALTH</option><option value="REGISTERED">REGISTERED</option><option value="UNREGISTERED">UNREGISTERED</option><option value="DISABLED">DISABLED</option></select></div></section><section class="panel hidden" id="editor"><div class="form"><div class="field"><label>STATION NUMBER</label><input id="number" placeholder="101"></div><div class="field"><label>NAME</label><input id="name" placeholder="AJNI CABIN"></div><div class="field"><label>LOCATION</label><input id="location" placeholder="AJNI"></div><div class="field"><label>SIP EXTENSION</label><input id="sip" placeholder="1001"></div><div class="field"><label>SECTION</label><select id="section"></select></div><div class="field"><label>STATION TYPE</label><select id="type"></select></div><button class="btn primary" id="save">ADD STATION</button></div></section><section class="panel"><div class="table"><div class="head"><b>NO.</b><b>NAME</b><b>LOCATION</b><b>SECTION</b><b>SIP</b><b>HEALTH</b><b>CALL</b><b>ACTIONS</b></div><div id="rows"></div></div></section></main><div class="modal hidden" id="modal"><div class="dialog"><div class="dialog-head"><b id="modalTitle">BULK IMPORT PREVIEW</b><button class="btn" id="modalClose">CLOSE</button></div><div class="dialog-body"><input id="csvFile" type="file" accept=".csv,text/csv"><div id="previewSummary" style="margin:10px 0;font-size:10px"></div><div class="preview" id="preview"><div style="padding:20px;text-align:center;color:#60747d">Select a CSV file to preview.</div></div></div><div class="dialog-foot"><button class="btn" id="modalCancel">CANCEL</button><button class="btn primary" id="importConfirm" disabled>IMPORT VALID ROWS</button></div></div></div><script>(async function(){'use strict';const A=TCCS_AUTH,$=id=>document.getElementById(id),API=A.API,PATH='/v1/station-management';let stations=[],sections=[],types=[],health=[],editing=null,previewRows=[];function msg(t,e){$('msg').textContent=t;$('msg').className='msg'+(e?' err':'')}function headers(){return{Authorization:'Bearer '+A.token(),'Content-Type':'application/json'}}async function api(path,opt){const r=await fetch(API+path,Object.assign({headers:headers()},opt||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}async function loadMasters(){[sections,types]=await Promise.all([api('/v1/master/sections'),api('/v1/master/station-types')]);$('section').innerHTML='<option value="">Select section</option>'+sections.filter(x=>x.enabled).map(x=>'<option value="'+x.id+'">'+x.code+' — '+x.name+'</option>').join('');$('type').innerHTML='<option value="">Select type</option>'+types.filter(x=>x.enabled).map(x=>'<option value="'+x.code+'">'+x.code+' — '+x.name+'</option>').join('')}async function load(){stations=await api(PATH+'?_='+Date.now());health=await api('/v1/asterisk/endpoints?_='+Date.now());render();updateStats()}function healthFor(s){return health.find(x=>String(x.sip_extension)===String(s.sip_extension))||null}function updateStats(){$('total').textContent=stations.length;$('enabled').textContent=stations.filter(s=>s.enabled).length;$('registered').textContent=stations.filter(s=>s.enabled&&healthFor(s)?.status==='REGISTERED').length;$('unregistered').textContent=stations.filter(s=>s.enabled&&healthFor(s)?.status!=='REGISTERED').length;$('active').textContent=stations.filter(s=>{const h=healthFor(s);return h&&h.asterisk_state&&h.asterisk_state!=='Not in use'}).length}function render(){const q=$('search').value.trim().toLowerCase(),f=$('healthFilter').value;const list=stations.filter(s=>{const h=healthFor(s),hs=!s.enabled?'DISABLED':(h?.status||'UNREGISTERED');return(!q||[s.station_number,s.name,s.location||'',s.sip_extension].join(' ').toLowerCase().includes(q))&&(f==='ALL'||hs===f)});$('rows').innerHTML=list.map(s=>{const h=healthFor(s),reg=s.enabled&&h?.status==='REGISTERED',state=h?.asterisk_state||'UNREGISTERED';return'<div class="row"><b>'+esc(s.station_number)+'</b><span>'+esc(s.name)+'</span><span>'+esc(s.location||'—')+'</span><span>'+esc((sections.find(x=>x.id===s.section_id)||{}).code||s.section_id)+'</span><span>'+esc(s.sip_extension)+'</span><span class="health '+(reg?'ok':'bad')+'">'+(s.enabled?(reg?'REGISTERED':'UNREGISTERED'):'DISABLED')+'</span><span class="health">'+esc(state)+'</span><span class="actions"><button class="btn" onclick="editStation('+s.id+')">EDIT</button><button class="btn" onclick="toggleStation('+s.id+')">'+(s.enabled?'DISABLE':'ENABLE')+'</button><button class="btn danger" onclick="deleteStation('+s.id+')">REMOVE</button></span></div>'}).join('')||'<div class="row">No stations found.</div>'}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function clearForm(){editing=null;$('number').value='';$('name').value='';$('location').value='';$('sip').value='';$('section').value='';$('type').value='';$('save').textContent='ADD STATION';$('editor').classList.add('hidden')}function editStation(id){const s=stations.find(x=>x.id===id);if(!s)return;editing=id;$('number').value=s.station_number;$('name').value=s.name;$('location').value=s.location||'';$('sip').value=s.sip_extension;$('section').value=s.section_id||'';$('type').value=s.station_type||'';$('save').textContent='UPDATE STATION';$('editor').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}window.editStation=editStation;window.toggleStation=async id=>{const s=stations.find(x=>x.id===id);if(!s)return;if(s.enabled&&!confirm('Disable '+s.station_number+'? Active-call protection will be checked by the server.'))return;try{await api(PATH+'/'+id,{method:'PUT',body:JSON.stringify({...s,enabled:!s.enabled})});msg('Station state updated');await load()}catch(e){msg(e.message,true)}};window.deleteStation=async id=>{const s=stations.find(x=>x.id===id);if(!s||!confirm('Remove '+s.station_number+'? The station will be disabled, not physically deleted.'))return;try{await api(PATH+'/'+id,{method:'DELETE'});msg('Station removed');await load()}catch(e){msg(e.message,true)}};$('add').onclick=()=>{clearForm();$('editor').classList.remove('hidden');$('section').value=sections[0]?.id||'';$('type').value=types[0]?.code||''};$('save').onclick=async()=>{const body={station_number:$('number').value.trim(),name:$('name').value.trim(),location:$('location').value.trim(),sip_extension:$('sip').value.trim(),section_id:$('section').value||null,station_type:$('type').value||null,enabled:true};try{if(editing){const old=stations.find(s=>s.id===editing);if(old&&old.sip_extension!==body.sip_extension&&!confirm('Replace SIP extension '+old.sip_extension+' with '+body.sip_extension+'? The server will reject the change if the station has an active call.'))return}await api(editing?PATH+'/'+editing:PATH,{method:editing?'PUT':'POST',body:JSON.stringify(body)});msg(editing?'Station updated':'Station added');clearForm();await load()}catch(e){msg(e.message,true)}};$('refresh').onclick=()=>load().catch(e=>msg(e.message,true));$('search').oninput=render;$('healthFilter').onchange=render;$('back').onclick=()=>location.href='/admin.html';$('logout').onclick=A.logout;function openModal(){previewRows=[];$('csvFile').value='';$('previewSummary').textContent='';$('preview').innerHTML='<div style="padding:20px;text-align:center;color:#60747d">Select a CSV file to preview.</div>';$('importConfirm').disabled=true;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden');previewRows=[];$('csvFile').value='';$('importConfirm').disabled=true}$('import').onclick=openModal;$('modalClose').onclick=closeModal;$('modalCancel').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').classList.contains('hidden'))closeModal()});function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const parseLine=line=>{const out=[];let cur='',quote=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++}else quote=!quote}else if(c===','&&!quote){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out};const headers=parseLine(lines[0]).map(x=>x.toLowerCase().replace(/\s+/g,'_'));return lines.slice(1).map((line,i)=>{const v=parseLine(line),o={_row:i+2};headers.forEach((h,j)=>o[h]=v[j]||'');return o})}function validateRow(r){const errs=[];if(!r.station_number)errs.push('station_number required');if(!r.name)errs.push('name required');if(!/^10\d{2}$/.test(r.sip_extension||''))errs.push('SIP must be 10xx');const section=sections.find(s=>String(s.id)===String(r.section_id)||String(s.code).toLowerCase()===String(r.section||'').toLowerCase());if(!section)errs.push('section not found');if(!r.station_type)r.station_type=types[0]?.code||'WAY_STATION';const type=types.find(t=>String(t.code).toLowerCase()===String(r.station_type).toLowerCase());if(!type)errs.push('station type not found');const dup=stations.find(s=>String(s.station_number)===String(r.station_number)||String(s.sip_extension)===String(r.sip_extension));if(dup)r._existing=dup;return{...r,_section_id:section?.id||r.section_id,_errors:errs}}$('csvFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const rows=parseCSV(await file.text());previewRows=rows.map(validateRow);const valid=previewRows.filter(r=>!r._errors.length);$('previewSummary').textContent=previewRows.length+' row(s) • '+valid.length+' valid • '+(previewRows.length-valid.length)+' invalid';$('preview').innerHTML='<table><thead><tr><th>ROW</th><th>STATION</th><th>NAME</th><th>SIP</th><th>SECTION</th><th>ACTION</th><th>VALIDATION</th></tr></thead><tbody>'+previewRows.map(r=>'<tr><td>'+r._row+'</td><td>'+esc(r.station_number)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.sip_extension)+'</td><td>'+esc(r.section||r.section_id||'')+'</td><td>'+esc(r._existing?'UPDATE':'CREATE')+'</td><td class="'+(r._errors.length?'bad':'ok')+'">'+esc(r._errors.join('; ')||'OK')+'</td></tr>').join('')+'</tbody></table>';$('importConfirm').disabled=!valid.length}catch(err){$('previewSummary').textContent='Unable to parse CSV';$('preview').innerHTML='<div style="padding:20px;color:#a3232a">'+esc(err.message)+'</div>';$('importConfirm').disabled=true}};$('importConfirm').onclick=async()=>{const valid=previewRows.filter(r=>!r._errors.length);if(!valid.length)return;const old=$('importConfirm').textContent;$('importConfirm').disabled=true;$('importConfirm').textContent='IMPORTING...';let ok=0,fail=0;for(const r of valid){try{const body={station_number:r.station_number,name:r.name,location:r.location||'',sip_extension:r.sip_extension,section_id:Number(r._section_id),station_type:r.station_type,enabled:r.enabled===''?true:!['false','0','no'].includes(String(r.enabled).toLowerCase())};if(r._existing)await api(PATH+'/'+r._existing.id,{method:'PUT',body:JSON.stringify(body)});else await api(PATH,{method:'POST',body:JSON.stringify(body)});ok++}catch(e){fail++}}closeModal();msg('Bulk import complete: '+ok+' successful'+(fail?', '+fail+' failed':''));await load();$('importConfirm').textContent=old};$('export').onclick=()=>{const cols=['station_number','name','location','section_id','sip_extension','station_type','enabled'];const lines=[cols.join(',')].concat(stations.map(s=>cols.map(k=>'"'+String(s[k]??'').replace(/"/g,'""')+'"').join(',')));const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tccs-stations.csv';a.click();URL.revokeObjectURL(url)};try{const u=await A.verify();if(!u)return;if(u.role!=='ADMINISTRATOR'){location.replace(A.landing(u));return}await loadMasters();await load()}catch(e){msg(e.message,true)}})();</script></body></html>
