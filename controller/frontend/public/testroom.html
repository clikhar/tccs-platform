<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Testroom</title><script src="/auth-guard.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#18313d;font-family:Arial}.top{background:#102e42;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:#fff;border:1px solid #afc1c9;border-radius:5px;padding:18px;cursor:pointer}.card:hover{border-color:#168a99;box-shadow:0 5px 15px #17333f18}.code{font-size:10px;color:#168a99;font-weight:bold}.card h3{margin:7px 0;font-size:17px}.card p{font-size:11px;color:#60747d}.btn{padding:9px 13px;border:1px solid #91a5af;background:#fff;border-radius:4px;font-weight:bold;font-size:10px;cursor:pointer}.msg{font-size:11px;margin-bottom:16px}.logout{margin-left:8px}</style></head><body><header class="top"><div><b>TCCS TESTROOM</b><div id="who" style="font-size:10px;opacity:.8"></div></div><div><button class="btn" onclick="location.href='/recordings.html'">RECORDINGS</button><button class="btn logout" id="logout">LOGOUT</button></div></header><main class="wrap"><h2>CONTROLLER SELECTION</h2><div id="msg" class="msg">Loading controllers...</div><div id="grid" class="grid"></div></main><script>(async function(){const u=await TCCS_AUTH.verify();if(!u)return;if(!['TESTROOM','ADMINISTRATOR'].includes(u.role)){location.replace(TCCS_AUTH.landing(u));return}document.getElementById('who').textContent=u.username+' • '+u.role;document.getElementById('logout').onclick=TCCS_AUTH.logout;try{const r=await fetch('/api/v1/master/available-controllers');const d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to load controllers');const grid=document.getElementById('grid');if(!d.length){document.getElementById('msg').textContent='No enabled controllers configured';return}document.getElementById('msg').textContent='Select a controller to open its operating page';d.forEach(c=>{const el=document.createElement('div');el.className='card';el.onclick=()=>location.href='/controller.html?controller_id='+encodeURIComponent(c.id);el.innerHTML='<div class="code">'+c.code+'</div><h3>'+c.name+'</h3><p>Section: '+(c.section_name||'Not assigned')+'</p>';grid.appendChild(el)})}catch(e){document.getElementById('msg').textContent=e.message}})();</script></body></html>
