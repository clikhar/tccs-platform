<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS Master Administration</title><style>body{margin:0;font-family:Arial;background:#edf2f5;color:#18313d}.top{background:#102e42;color:#fff;padding:18px 24px;display:flex;justify-content:space-between}.wrap{max-width:1500px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #afc1c9;border-radius:4px;padding:14px}.login{max-width:420px;margin:70px auto}.field,.grid label{display:grid;gap:4px;margin-bottom:10px;font-size:10px;font-weight:bold}.field input,.grid input,.grid select,.search{padding:9px;border:1px solid #9db1ba;border-radius:3px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{padding:8px 12px;border:1px solid #91a5af;background:#fff;border-radius:3px;font-size:10px;font-weight:bold;cursor:pointer}.primary{background:#168a99;color:#fff}.danger{background:#fff0f1;color:#a3232a;border-color:#d58a8f}.hidden{display:none}.msg{padding:8px;margin-bottom:10px;background:#d8e8ed;border-left:4px solid #299cac;font-size:10px}.err{background:#fff0f1;color:#a3232a;border-left-color:#bd2e35}.tabs{display:flex;margin:12px 0;border-bottom:1px solid #b9cbd2}.tab{border-radius:0;background:#e4ecef}.tab.active{background:#1d5367;color:#fff}.toolbar{display:flex;gap:7px;margin-bottom:10px}.toolbar .search{flex:1}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid #b7c9d0;background:#f5fafb;padding:10px}.card b{display:block;font-size:9px}.card strong{font-size:22px}.form{background:#f3fafb;border:1px solid #9fc9cf;padding:12px;margin-bottom:12px}.actions{display:flex;justify-content:flex-end;gap:6px}.table{overflow:auto;border:1px solid #afc5cb}.head,.row{display:grid;gap:7px;align-items:center;min-width:760px}.section-grid{grid-template-columns:130px 1fr 100px 220px}.station-grid{grid-template-columns:90px 1.4fr 130px 90px 170px 260px}.type-grid{grid-template-columns:130px 1fr 100px 220px}.head{background:#1d5367;color:#fff;padding:8px;font-size:8px}.row{padding:8px;border-bottom:1px solid #d9e4e8;font-size:10px}.on,.reg{color:#087c4d;font-weight:bold}.off,.unreg{color:#a3232a;font-weight:bold}.rowactions{display:flex;gap:4px;flex-wrap:wrap}@media(max-width:850px){.grid,.cards{grid-template-columns:1fr}}</style></head><body>
<div id="loginView" class="wrap"><section class="panel login"><h2>TCCS ADMINISTRATOR LOGIN</h2><div id="loginMsg" class="msg hidden"></div><div class="field"><label>USERNAME</label><input id="loginUser" value="admin"></div><div class="field"><label>PASSWORD</label><input id="loginPass" type="password"></div><button class="primary" style="width:100%" onclick="login()">LOGIN</button></section></div>
<div id="appView" class="hidden"><header class="top"><div><b>TCCS MASTER ADMINISTRATION</b><div style="font-size:10px">Sections • Stations / Subscribers • Station Types</div></div><div><span id="userLabel"></span> <button onclick="logout()">LOGOUT</button></div></header><main class="wrap"><section class="panel"><div id="msg" class="msg hidden"></div><div class="cards"><div class="card"><b>ACTIVE SECTIONS</b><strong id="sectionCount">0</strong></div><div class="card"><b>ACTIVE SUBSCRIBERS</b><strong id="stationCount">0</strong></div><div class="card"><b>ACTIVE STATION TYPES</b><strong id="typeCount">0</strong></div></div><nav class="tabs"><button class="tab active" data-tab="sections" onclick="tab('sections')">SECTIONS MASTER</button><button class="tab" data-tab="stations" onclick="tab('stations')">STATIONS / SUBSCRIBERS</button><button class="tab" data-tab="types" onclick="tab('types')">STATION TYPES</button></nav>
<section id="sections" class="view"><div class="toolbar"><input id="sectionSearch" class="search" placeholder="Search section code / name"><button class="primary" onclick="newSection()">ADD SECTION</button><button onclick="loadAll()">REFRESH</button></div><div id="sectionForm" class="form hidden"><div class="grid"><label>CODE<input id="sectionCode"></label><label>NAME<input id="sectionName"></label><label>STATUS<select id="sectionEnabled"><option value="true">ENABLED</option><option value="false">DISABLED</option></select></label></div><div class="actions"><button class="primary" onclick="saveSection()">SAVE</button><button onclick="cancelSection()">CANCEL</button></div></div><div class="table"><div class="head section-grid"><b>CODE</b><b>NAME</b><b>STATUS</b><b>ACTIONS</b></div><div id="sectionRows"></div></div></section>
<section id="stations" class="view hidden"><div class="toolbar"><input id="stationSearch" class="search" placeholder="Search station / name / location / SIP"><button class="primary" onclick="newStation()">ADD SUBSCRIBER</button><button onclick="loadAll()">REFRESH</button></div><div id="stationForm" class="form hidden"><div class="grid"><label>STATION NUMBER<input id="stationNumber"></label><label>STATION NAME<input id="stationName"></label><label>LOCATION<input id="stationLocation"></label><label>SIP EXTENSION<input id="stationSip" placeholder="10xx"></label><label>SECTION<select id="stationSection"></select></label><label>STATION TYPE<select id="stationType"></select></label></div><label><input id="stationEnabled" type="checkbox" checked> ENABLED</label><div class="actions"><button class="primary" onclick="saveStation()">SAVE</button><button onclick="cancelStation()">CANCEL</button></div></div><div class="table"><div class="head station-grid"><b>STATION</b><b>NAME</b><b>SECTION</b><b>SIP</b><b>STATUS</b><b>ACTIONS</b></div><div id="stationRows"></div></div></section>
<section id="types" class="view hidden"><div class="toolbar"><input id="typeSearch" class="search" placeholder="Search type code / name"><button class="primary" onclick="newType()">ADD STATION TYPE</button><button onclick="loadAll()">REFRESH</button></div><div id="typeForm" class="form hidden"><div class="grid"><label>TYPE CODE<input id="typeCode"></label><label>TYPE NAME<input id="typeName"></label><label>PRIORITY<input id="typePriority" type="number" value="100" min="1"></label></div><label><input id="typeEnabled" type="checkbox" checked> ENABLED</label><div class="actions"><button class="primary" onclick="saveType()">SAVE</button><button onclick="cancelType()">CANCEL</button></div></div><div class="table"><div class="head type-grid"><b>CODE</b><b>NAME</b><b>STATUS</b><b>ACTIONS</b></div><div id="typeRows"></div></div></section></section></main></div>
<script>
const API=location.protocol+'//'+location.hostname+':8000';let token=localStorage.getItem('tccs_admin_token')||'',sections=[],stations=[],types=[],endpoints=[],editingSection=null,editingStation=null,editingType=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function showMsg(t,e=false,target='msg'){const m=$(target);m.textContent=t;m.className='msg'+(e?' err':'');if(!t)m.classList.add('hidden')}async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch(API+path,opt),d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)logout();throw Error(d.detail||('HTTP '+r.status))}return d}
async function login(){try{const d=await api('/api/v1/master/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value.trim(),password:$('loginPass').value})});token=d.access_token;localStorage.setItem('tccs_admin_token',token);$('userLabel').textContent=d.username+' • ADMIN';$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await loadAll()}catch(e){showMsg(e.message,true,'loginMsg')}}function logout(){token='';localStorage.removeItem('tccs_admin_token');$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')}
async function tab(n){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('hidden',x.id!==n));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===n));if(n==='stations'&&token){try{await refreshStationMasters()}catch(e){showMsg(e.message,true)}}}
async function loadAll(){try{[sections,stations,types,endpoints]=await Promise.all([api('/api/v1/master/sections?_='+Date.now()),api('/api/v1/master/stations?_='+Date.now()),api('/api/v1/master/station-types?_='+Date.now()),api('/api/v1/asterisk/endpoints')]);$('sectionCount').textContent=sections.filter(x=>x.enabled).length;$('stationCount').textContent=stations.filter(x=>x.enabled).length;$('typeCount').textContent=types.filter(x=>x.enabled).length;fillSelects();renderSections();renderStations();renderTypes();showMsg('Master data refreshed')}catch(e){showMsg(e.message,true)}}
async function refreshStationMasters(){[sections,types]=await Promise.all([api('/api/v1/master/sections?_='+Date.now()),api('/api/v1/master/station-types?_='+Date.now())]);$('sectionCount').textContent=sections.filter(x=>x.enabled).length;$('typeCount').textContent=types.filter(x=>x.enabled).length;fillSelects();renderSections();renderTypes()}
function fillSelects(){let s=$('stationSection').value,t=$('stationType').value;$('stationSection').innerHTML='<option value="">Select section</option>'+sections.filter(x=>x.enabled).map(x=>`<option value="${x.id}">${esc(x.code)} — ${esc(x.name)}</option>`).join('');if([...$('stationSection').options].some(o=>o.value===String(s)))$('stationSection').value=s;$('stationType').innerHTML='<option value="">Select type</option>'+types.filter(x=>x.enabled).map(x=>`<option value="${esc(x.code)}">${esc(x.code)} — ${esc(x.name)}</option>`).join('');if([...$('stationType').options].some(o=>o.value===String(t)))$('stationType').value=t}
function renderSections(){let q=$('sectionSearch').value.trim().toLowerCase(),a=sections.filter(x=>!q||(x.code+' '+x.name).toLowerCase().includes(q));$('sectionRows').innerHTML=a.map(x=>`<div class="row section-grid"><b>${esc(x.code)}</b><span>${esc(x.name)}</span><span class="${x.enabled?'on':'off'}">${x.enabled?'ENABLED':'DISABLED'}</span><span class="rowactions"><button onclick="editSection(${x.id})">EDIT</button><button onclick="toggleSection(${x.id})">${x.enabled?'DISABLE':'ENABLE'}</button><button class="danger" onclick="removeSection(${x.id})">REMOVE</button></span></div>`).join('')||'<div>No sections found.</div>'}function newSection(){editingSection=null;$('sectionCode').value='';$('sectionName').value='';$('sectionEnabled').value='true';$('sectionForm').classList.remove('hidden')}function editSection(id){let x=sections.find(y=>y.id===id);if(!x)return;editingSection=id;$('sectionCode').value=x.code;$('sectionName').value=x.name;$('sectionEnabled').value=String(x.enabled);$('sectionForm').classList.remove('hidden')}function cancelSection(){$('sectionForm').classList.add('hidden');editingSection=null}async function saveSection(){try{let p={code:$('sectionCode').value.trim(),name:$('sectionName').value.trim(),enabled:$('sectionEnabled').value==='true'};await api(editingSection?'/api/v1/master/sections/'+editingSection:'/api/v1/master/sections',{method:editingSection?'PUT':'POST',body:JSON.stringify(p)});cancelSection();await loadAll()}catch(e){showMsg(e.message,true)}}async function toggleSection(id){let x=sections.find(y=>y.id===id);if(x)try{await api('/api/v1/master/sections/'+id,{method:'PUT',body:JSON.stringify({enabled:!x.enabled})});await loadAll()}catch(e){showMsg(e.message,true)}}async function removeSection(id){let x=sections.find(y=>y.id===id);if(!x||!confirm('Remove section '+x.code+'?'))return;try{await api('/api/v1/master/sections/'+id,{method:'DELETE'});await loadAll()}catch(e){showMsg(e.message,true)}}
function renderStations(){let q=$('stationSearch').value.trim().toLowerCase(),reg=new Map(endpoints.map(e=>[e.sip_extension,e])),a=stations.filter(x=>!q||[x.station_number,x.name,x.location||'',x.sip_extension,x.station_type].join(' ').toLowerCase().includes(q));$('stationRows').innerHTML=a.map(x=>{let e=reg.get(x.sip_extension),s=sections.find(y=>y.id===x.section_id);return `<div class="row station-grid"><b>${esc(x.station_number)}</b><span>${esc(x.name)}<br><small>${esc(x.location||'')}</small></span><span>${esc(s?.code||x.section_id)}</span><span>${esc(x.sip_extension)}</span><span class="${x.enabled?'on':'off'}">${x.enabled?'ENABLED':'DISABLED'}<br><small class="${e?.status==='REGISTERED'?'reg':'unreg'}">${e?.status==='REGISTERED'?'REGISTERED':'UNREGISTERED'}</small></span><span class="rowactions"><button onclick="editStation(${x.id})">EDIT</button><button onclick="toggleStation(${x.id})">${x.enabled?'DISABLE':'ENABLE'}</button><button class="danger" onclick="removeStation(${x.id})">REMOVE</button></span></div>`}).join('')||'<div>No subscribers found.</div>'}
async function newStation(){try{await refreshStationMasters()}catch(e){showMsg(e.message,true);return}editingStation=null;['stationNumber','stationName','stationLocation','stationSip'].forEach(id=>$(id).value='');$('stationSection').value='';$('stationType').value='';$('stationEnabled').checked=true;$('stationForm').classList.remove('hidden')}function editStation(id){let x=stations.find(y=>y.id===id);if(!x)return;editingStation=id;$('stationNumber').value=x.station_number;$('stationName').value=x.name;$('stationLocation').value=x.location||'';$('stationSip').value=x.sip_extension;fillSelects();$('stationSection').value=x.section_id;$('stationType').value=x.station_type;$('stationEnabled').checked=x.enabled;$('stationForm').classList.remove('hidden')}function cancelStation(){$('stationForm').classList.add('hidden');editingStation=null}async function saveStation(){try{let p={station_number:$('stationNumber').value.trim(),name:$('stationName').value.trim(),location:$('stationLocation').value.trim(),sip_extension:$('stationSip').value.trim(),section_id:Number($('stationSection').value),station_type:$('stationType').value,enabled:$('stationEnabled').checked};await api(editingStation?'/api/v1/master/stations/'+editingStation:'/api/v1/master/stations',{method:editingStation?'PUT':'POST',body:JSON.stringify(p)});cancelStation();await loadAll()}catch(e){showMsg(e.message,true)}}async function toggleStation(id){let x=stations.find(y=>y.id===id);if(x)try{await api('/api/v1/master/stations/'+id,{method:'PUT',body:JSON.stringify({enabled:!x.enabled})});await loadAll()}catch(e){showMsg(e.message,true)}}async function removeStation(id){let x=stations.find(y=>y.id===id);if(!x||!confirm('Remove subscriber '+x.station_number+'?'))return;try{await api('/api/v1/master/stations/'+id,{method:'DELETE'});await loadAll()}catch(e){showMsg(e.message,true)}}
function renderTypes(){let q=$('typeSearch').value.trim().toLowerCase(),a=types.filter(x=>!q||(x.code+' '+x.name).toLowerCase().includes(q));$('typeRows').innerHTML=a.map(x=>`<div class="row type-grid"><b>${esc(x.code)}</b><span>${esc(x.name)}</span><span class="${x.enabled?'on':'off'}">${x.enabled?'ENABLED':'DISABLED'}</span><span class="rowactions"><button onclick="editType(${x.id})">EDIT</button><button onclick="toggleType(${x.id})">${x.enabled?'DISABLE':'ENABLE'}</button><button class="danger" onclick="removeType(${x.id})">REMOVE</button></span></div>`).join('')||'<div>No station types found.</div>'}function newType(){editingType=null;$('typeCode').value='';$('typeName').value='';$('typePriority').value='100';$('typeEnabled').checked=true;$('typeForm').classList.remove('hidden')}function editType(id){let x=types.find(y=>y.id===id);if(!x)return;editingType=id;$('typeCode').value=x.code;$('typeName').value=x.name;$('typePriority').value=x.priority;$('typeEnabled').checked=x.enabled;$('typeForm').classList.remove('hidden')}function cancelType(){$('typeForm').classList.add('hidden');editingType=null}async function saveType(){try{let p={code:$('typeCode').value.trim(),name:$('typeName').value.trim(),priority:Number($('typePriority').value),enabled:$('typeEnabled').checked};await api(editingType?'/api/v1/master/station-types/'+editingType:'/api/v1/master/station-types',{method:editingType?'PUT':'POST',body:JSON.stringify(p)});cancelType();await loadAll()}catch(e){showMsg(e.message,true)}}async function toggleType(id){let x=types.find(y=>y.id===id);if(x)try{await api('/api/v1/master/station-types/'+id,{method:'PUT',body:JSON.stringify({enabled:!x.enabled})});await loadAll()}catch(e){showMsg(e.message,true)}}async function removeType(id){let x=types.find(y=>y.id===id);if(!x||!confirm('Remove station type '+x.code+'?'))return;try{await api('/api/v1/master/station-types/'+id,{method:'DELETE'});await loadAll()}catch(e){showMsg(e.message,true)}}
$('sectionSearch').addEventListener('input',renderSections);$('stationSearch').addEventListener('input',renderStations);$('typeSearch').addEventListener('input',renderTypes);$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});(async()=>{if(!token)return;try{let me=await api('/api/v1/master/me');$('userLabel').textContent=me.username+' • ADMIN';$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await loadAll()}catch(e){logout()}})();</script></body></html>
