<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCCS User Roles</title><script src="/auth-guard.js"></script><style>body{margin:0;background:#edf2f5;color:#18313d;font-family:Arial}.top{background:#102e42;color:#fff;padding:16px 22px;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#fff;border:1px solid #afc1c9;border-radius:5px;padding:18px}.code{font-size:10px;color:#168a99;font-weight:bold}.card h2{font-size:17px;margin:8px 0}.card p{font-size:11px;color:#60747d;line-height:1.5}.perm{padding:7px;background:#eef5f7;margin-top:5px;font-size:10px;font-weight:bold}.btn{padding:8px 12px;border:1px solid #91a5af;background:#fff;border-radius:3px;font-size:10px;font-weight:bold}</style></head><body><header class="top"><b>TCCS USER ROLES</b><button class="btn" id="back">ADMIN HOME</button></header><main class="wrap"><div id="grid" class="grid"></div></main><script>(async function(){const A=TCCS_AUTH,u=await A.verify();if(!u)return;if(u.role!=='ADMINISTRATOR'){location.replace(A.landing(u));return}document.getElementById('back').onclick=()=>location.href='/admin.html';try{const r=await fetch(A.API+'/v1/master/roles',{headers:{Authorization:'Bearer '+A.token()}});const roles=await r.json();if(!r.ok)throw Error(roles.detail||('HTTP '+r.status));document.getElementById('grid').innerHTML=roles.map(x=>'<section class="card"><div class="code">'+x.code+'</div><h2>'+x.name+'</h2><p>'+x.description+'</p>'+x.permissions.map(p=>'<div class="perm">'+p+'</div>').join('')+'</section>').join('')}catch(e){document.getElementById('grid').textContent=e.message}})();</script></body></html>
