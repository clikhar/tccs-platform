<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102e42">
<title>TCCS Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9eff2;font-family:Arial,sans-serif;color:#17333f}.login{width:min(420px,92vw);background:#fff;border:1px solid #aebfc6;border-radius:6px;box-shadow:0 10px 30px #17333f18;padding:28px}.brand{background:#102e42;color:#fff;margin:-28px -28px 24px;padding:22px 24px;border-radius:6px 6px 0 0}.brand b{font-size:20px}.brand div{font-size:11px;margin-top:5px;opacity:.8}.field{display:grid;gap:6px;margin:14px 0;font-size:11px;font-weight:bold}.field input{width:100%;padding:12px;border:1px solid #9fb2ba;border-radius:4px;font-size:14px}.btn{width:100%;padding:12px;border:0;border-radius:4px;background:#168a99;color:#fff;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin:12px 0;padding:10px;border-left:4px solid #168a99;background:#e2f0f3;font-size:11px}.err{border-left-color:#b52b34;background:#fff0f1;color:#8c1f26}.role{margin-top:18px;font-size:10px;color:#62747c;line-height:1.6}
</style>
</head>
<body>
<section class="login"><div class="brand"><b>TCCS</b><div>TRAIN CONTROL COMMUNICATION SYSTEM</div></div><h2>USER LOGIN</h2><div id="msg" class="msg" style="display:none"></div><div class="field"><label>USERNAME</label><input id="username" autocomplete="username"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password"></div><button id="login" class="btn">LOGIN</button><div class="role"><b>Authorized roles</b><br>Controller • Testroom • Administrator</div></section>
<script>
(function(){
'use strict';
const API='/api',tokenKey='tccs_user_token',userKey='tccs_user';
const $=id=>document.getElementById(id),show=(t,e)=>{const m=$('msg');m.textContent=t;m.className='msg'+(e?' err':'');m.style.display=t?'block':'none'};
if(localStorage.getItem(tokenKey)){try{const u=JSON.parse(localStorage.getItem(userKey)||'null');if(u)location.replace(u.role==='ADMINISTRATOR'?'/admin.html':u.role==='TESTROOM'?'/testroom.html':'/controller.html')}catch{}}
async function login(){const b=$('login');b.disabled=true;b.textContent='AUTHENTICATING...';show('');try{const r=await fetch(API+'/v1/master/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||('HTTP '+r.status));localStorage.setItem(tokenKey,d.access_token);localStorage.setItem(userKey,JSON.stringify(d));location.replace(d.role==='ADMINISTRATOR'?'/admin.html':d.role==='TESTROOM'?'/testroom.html':'/controller.html')}catch(e){show(e.message||'Unable to connect to TCCS server',true)}finally{b.disabled=false;b.textContent='LOGIN'}}
$('login').addEventListener('click',login);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
})();
</script>
</body>
</html>
