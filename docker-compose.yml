services:
  postgres:
    image: postgres:16
    container_name: tccs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tccs
      POSTGRES_USER: tccs
      POSTGRES_PASSWORD: change-me-local
    ports:
      - "5432:5432"
    volumes:
      - tccs-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tccs -d tccs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tccs-postgres-data:
